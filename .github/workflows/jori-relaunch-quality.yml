name: Jori & Flimm Neustart – Story und Freigabepruefung

on:
  push:
    branches:
      - feature/jori-flimm-neustart-folge001
    paths:
      - kids/jori-flimm/relaunch-v2/**
      - .github/workflows/jori-relaunch-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  episode-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jori-flimm-neustart-folge001
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            kids/jori-flimm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run creative story, real scene requirements and fail-closed video QA tests
        run: |
          python3 -m compileall -q kids/jori-flimm/relaunch-v2/scripts
          python3 -m unittest discover -s kids/jori-flimm/relaunch-v2/scripts -p 'test_*.py' -v
          python3 kids/jori-flimm/relaunch-v2/scripts/generate_episode.py --date 2026-10-28 --dry-run | tee /tmp/jori-next-draft.log
          grep "REBOOT_DRY_RUN_OK e006 2026-10-28" /tmp/jori-next-draft.log
          PYTHONPATH=kids/jori-flimm/relaunch-v2/scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from generate_episode import validate_candidate, assemble_narration
          root=Path("kids/jori-flimm/relaunch-v2/drafts")
          for p in root.glob("*.json"):
              d=json.loads(p.read_text(encoding="utf-8"))
              assert d["series_version"]=="relaunch-v2"
              assert validate_candidate(d, [],d["episode_number"])
              assert d["narration"]==assemble_narration(d)
              assert d["approved_for_publish"] is False
              assert d["voice"]["speaker_id"]=="Sulafat"
              print("RELAUNCH_ORIGINAL_DRAFT_STORY_FORMULA_PASS",p.name)
          PY
      - name: Check clean 001 state and mandatory narrator
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('kids/jori-flimm/relaunch-v2')
          st=json.loads((p/'state/series-state.json').read_text(encoding='utf-8'))
          assert st['series_version']=='relaunch-v2'
          assert st['next_episode_number']==1
          assert st['last_successful_episode']==0
          assert st['voice']['speaker_id']=='Sulafat'
          assert st['release_authorized'] is False
          assert st['public_tiktok_connected'] is False
          print('RELAUNCH_CI_OK: episode 001 first; publishing locked')
          PY
