name: Jori & Flimm – episodes 002 to 005 fast runner
on:
  push:
    branches:
      - feature/jori-flimm-neustart-folge001
    paths:
      - .github/workflows/jori-followups-fast.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jori-followups-fast-002-005
  cancel-in-progress: false
jobs:
  episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jori-flimm-neustart-folge001
          fetch-depth: 1
          sparse-checkout: |
            kids/jori-flimm
            published
            .github/workflows/jori-followups-fast.yml
      - name: Install GitHub video tools for rendering or art refresh
        env:
          JORI_REFRESH_ART: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Jori unique art refresh v2' }}
        run: |
          needs_tools=0
          for ep in 2 3 4 5; do
            file=$(printf "published/jori-flimm-2026-10-%02d-e%03d.mp4" "$((22+ep-1))" "$ep")
            if ! git ls-tree -r --name-only HEAD -- "$file" | grep -Fxq "$file"; then
              needs_tools=1
            fi
          done
          if [ "$JORI_REFRESH_ART" = "true" ]; then needs_tools=1; fi
          if [ "$needs_tools" = "1" ]; then
            command -v ffmpeg || sudo apt-get install -y ffmpeg
            test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || sudo apt-get install -y fonts-dejavu-core
            python3 -c 'from PIL import Image, ImageDraw, ImageFont' || python3 -m pip install --user --break-system-packages Pillow
          else
            echo "JORI_ALL_RENDERS_REUSED; skip video tool installation"
          fi
      - name: Prepare Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Render and schedule four consecutive story episodes
        env:
          JORI_GEMINI_API_KEY: ${{ secrets.JORI_GEMINI_API_KEY }}
          JORI_TTS_MODEL: gemini-3.8-flash-lite-tts
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          JORI_REFRESH_ART: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Jori unique art refresh' }}
        run: |
          set -euo pipefail
          test -n "$JORI_GEMINI_API_KEY" || { echo "Missing Jori TTS key"; exit 1; }
          test -n "$BUFFER_API_KEY" || { echo "Missing Buffer API key"; exit 1; }
          if [ "$JORI_REFRESH_ART" = "true" ]; then
            for ep in 2 3 4 5; do
              echo "::group::JORI_ART_REFRESH_00$ep"
              file=$(printf "published/jori-flimm-2026-10-%02d-e%03d.mp4" "$((22+ep-1))" "$ep")
              python3 kids/jori-flimm/relaunch-v2/scripts/github_restore_audio_from_existing_video.py --episode "$ep"
              python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer.py --episode "$ep"
              ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$file"
              git add --sparse "$file"
              if ! git diff --cached --quiet; then
                git commit -m "kids: refresh Jori episode $(printf "%03d" "$ep") with unique art"
                git pull --rebase origin feature/jori-flimm-neustart-folge001
                git push origin HEAD:feature/jori-flimm-neustart-folge001
              fi
              python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_buffer.py --episode "$ep" --replace-existing
              echo "::endgroup::"
            done
            exit 0
          fi
          for ep in 2 3 4 5; do
            echo "::group::JORI_FOLGE_00$ep"
            file=$(printf "published/jori-flimm-2026-10-%02d-e%03d.mp4" "$((22+ep-1))" "$ep")
            # Reuse branch MP4s. This keeps retries idempotent and avoids repeated TTS/API usage.
            if git ls-tree HEAD -- "$file" | grep -Fq "$file"; then
              echo "JORI_EXISTING_RENDER_REUSED episode=$ep path=$file"
            else
              if [ "$ep" = "3" ] || [ "$ep" = "5" ]; then
                python3 kids/jori-flimm/relaunch-v2/scripts/github_restore_followup_audio.py --episode "$ep"
              else
                python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_voice.py --episode "$ep"
              fi
              python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer.py --episode "$ep"
              ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$file"
              git add --sparse "$file"
              if ! git diff --cached --quiet; then
                git commit -m "kids: render Jori episode $(printf '%03d' "$ep") in GitHub"
                git pull --rebase origin feature/jori-flimm-neustart-folge001
                git push origin HEAD:feature/jori-flimm-neustart-folge001
              fi
            fi
            # The Buffer helper checks for an existing scheduled episode before creating a post.
            python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_buffer.py --episode "$ep"
            echo "::endgroup::"
          done
      - name: Save production render samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jori-Episodes-002-005-GitHub-Production
          path: published/jori-flimm-2026-10-*.mp4
          retention-days: 14
          if-no-files-found: warn
