name: Jori & Flimm Daily Handoff
run-name: Kids Daily ${{ inputs.issue_number }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing [JORI-FLIMM-DAY] issue number containing the episode JSON"
        required: true
        type: string
      target_ref:
        description: "Isolated kids branch to dispatch"
        required: true
        default: feature/jori-flimm-kids-pipeline
        type: string

permissions:
  actions: write
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate handoff and dispatch renderer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET_REF: ${{ inputs.target_ref }}
          RUN_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          num=os.environ["ISSUE_NUMBER"].strip()
          ref=os.environ["TARGET_REF"].strip()
          run_ref=os.environ["RUN_REF"]
          expected="feature/jori-flimm-kids-pipeline"
          if not re.fullmatch(r"\d+",num):
              raise SystemExit("Issue number must be numeric")
          if ref != expected or run_ref != expected:
              raise SystemExit("Kids workflow is restricted to the isolated feature branch")
          base=f"https://api.github.com/repos/{repo}"
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"jori-flimm-handoff"
          }
          def gh(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise RuntimeError(e.read().decode("utf-8","replace"))
          issue=gh("GET",f"/issues/{num}")
          if not str(issue.get("title","")).startswith("[JORI-FLIMM-DAY]"):
              raise SystemExit("Wrong issue type")
          try:
              p=json.loads(issue.get("body") or "")
          except json.JSONDecodeError as e:
              raise SystemExit(f"Body must be pure JSON: {e}")
          if not isinstance(p.get("scenes"),list) or not 5 <= len(p["scenes"]) <= 10:
              raise SystemExit("Need 5-10 scenes")
          if p.get("audio_url") and not str(p.get("audio_url")).startswith("https://"):
              raise SystemExit("audio_url must be https when provided")
          qc=p.get("qc") or {}
          for key in ["book_spoiler_check","continuity_check","duplicate_check"]:
              if qc.get(key) is not True:
                  raise SystemExit(f"QC gate not true: {key}")
          gh("POST","/actions/workflows/kids-render.yml/dispatches",{
              "ref":ref,
              "inputs":{"issue_number":num}
          })
          print(f"JORI_FLIMM_HANDOFF_OK ref={ref} issue={num}")
          PY
