name: Buffer Status Monitor

on:
  push:
    paths:
      - ".github/workflows/buffer-monitor.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # This monitor only reads/writes diagnostics/buffer-status.json.
          # Avoid materializing the growing published MP4 tree on each status refresh.
          sparse-checkout: |
            diagnostics

      # Keep the hourly GitHub check, but spend Buffer API quota only when
      # a scheduled slot becomes due, an incomplete status needs follow-up,
      # the next regular batch is missing, or the snapshot needs refreshing.
      - name: Decide if Buffer needs a live API refresh
        id: gate
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, time, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          BERLIN = ZoneInfo("Europe/Berlin")
          SLOTS = ((7, 0), (12, 0), (18, 30), (22, 0))

          def utc(value):
              try:
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  return parsed.astimezone(timezone.utc) if parsed.tzinfo else None
              except (TypeError, ValueError):
                  return None

          def poll_reason(snapshot, now):
              if not isinstance(snapshot, dict):
                  return "snapshot_missing_or_invalid"
              checked = utc(snapshot.get("checked_at_utc"))
              posts = snapshot.get("posts")
              if not checked or not isinstance(posts, list) or not posts:
                  return "snapshot_incomplete"
              if checked > now + timedelta(minutes=5):
                  return "snapshot_future_timestamp"
              if now - checked >= timedelta(hours=12):
                  return "snapshot_age_12h"

              due_counts = Counter()
              for post in posts:
                  if not isinstance(post, dict):
                      return "invalid_post"
                  status = post.get("status")
                  due = utc(post.get("dueAt"))
                  if status == "error":
                      return "buffer_error_post"
                  if due is None:
                      return "invalid_post_dueAt"
                  due_counts[due] += 1
                  if status == "scheduled" and due + timedelta(minutes=2) <= now:
                      return "scheduled_post_now_due"
                  if status == "sent" and due <= now:
                      link = str(post.get("externalLink") or "")
                      if not link.startswith(("https://tiktok.com/", "https://www.tiktok.com/")):
                          return "sent_post_missing_tiktok_proof"

              if any(count > 1 for count in due_counts.values()):
                  return "duplicate_dueAt_in_snapshot"

              local = now.astimezone(BERLIN)
              # D+2 is expected ONLY after the regular 22:37 Berlin window.
              offset = 2 if (local.hour, local.minute) >= (22, 37) else 1
              target = local.date() + timedelta(days=offset)
              expected = {
                  datetime.combine(target, time(h, m), BERLIN).astimezone(timezone.utc)
                  for h, m in SLOTS
              }
              if not expected.issubset(due_counts.keys()):
                  return "next_regular_batch_not_in_snapshot"
              return None

          # Pure, offline guard tests. No video, GitHub dispatch, or Buffer API call.
          base = datetime(2026, 11, 23, 5, 10, tzinfo=timezone.utc)
          def sample():
              all_due = [
                  datetime.combine(day, time(h, m), BERLIN).astimezone(timezone.utc)
                  for day in ((base.astimezone(BERLIN)).date(),
                              (base.astimezone(BERLIN)).date() + timedelta(days=1))
                  for h, m in SLOTS
              ]
              return {
                  "checked_at_utc": (base - timedelta(minutes=2)).isoformat(),
                  "posts": [
                      {"id": str(i), "status": "scheduled",
                       "dueAt": due.isoformat(), "externalLink": None}
                      for i, due in enumerate(all_due)
                  ],
              }
          test = sample()
          assert poll_reason(test, base) is None
          assert poll_reason(test, base + timedelta(minutes=55)) == "scheduled_post_now_due"
          assert poll_reason({**test, "posts": test["posts"][:-1]}, base) == "next_regular_batch_not_in_snapshot"
          assert poll_reason({**test, "posts": [{**test["posts"][0], "status": "error"}] + test["posts"][1:]}, base) == "buffer_error_post"
          assert poll_reason(test, base + timedelta(hours=13)) == "snapshot_age_12h"
          print("BUFFER_GATE_TESTS_OK")

          try:
              snapshot = json.loads(Path("diagnostics/buffer-status.json").read_text(encoding="utf-8"))
          except (OSError, ValueError):
              snapshot = None
          reason = poll_reason(snapshot, datetime.now(timezone.utc))
          should_query = "true" if reason else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_query={should_query}\n")
          print("BUFFER_GATE_QUERY" if reason else "BUFFER_GATE_SKIP", reason or "no_new_due_slot")
          PY

      - name: Read Buffer status for motus614
        if: steps.gate.outputs.should_query == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          api = "https://api.buffer.com"
          key = os.environ["BUFFER_API_KEY"].strip()

          def gql(query, variables=None):
              payload = {"query": query}
              if variables is not None:
                  payload["variables"] = variables
              req = urllib.request.Request(
                  api,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {key}",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
                  for limit in response.headers.get_all("RateLimit", []):
                      print("BUFFER_RATE_LIMIT", limit)
              if result.get("errors"):
                  raise SystemExit(json.dumps(result["errors"], ensure_ascii=False))
              return result["data"]

          # Reuse previously verified Buffer IDs: normal hourly checks need ONE
          # GraphQL request instead of repeated organization/channel discovery.
          # Verify both identities in that same query; rediscover on mismatch.
          post_selection = """
            posts(first: 50, input: $input) {
              edges {
                node {
                  id text status dueAt sentAt externalLink channelId
                  assets { mimeType source }
                }
              }
            }
          """

          def posts_input(org_id, channel_id):
              return {
                  "organizationId": org_id,
                  "filter": {
                      "channelIds": [channel_id],
                      "status": ["scheduled", "sent", "error"],
                  },
                  "sort": [
                      {"field": "dueAt", "direction": "desc"},
                      {"field": "createdAt", "direction": "desc"},
                  ],
              }

          def discover():
              orgs = gql("query { account { organizations { id name } } }")["account"]["organizations"]
              if not orgs:
                  raise SystemExit("No Buffer organization found")
              org = orgs[0]
              channels = gql(
                  """query Channels($orgId: OrganizationId!) {
                    channels(input: { organizationId: $orgId }) {
                      id name displayName service
                    }
                  }""",
                  {"orgId": org["id"]},
              )["channels"]
              channel = next(
                  (c for c in channels
                   if str(c.get("service", "")).lower() == "tiktok"
                   and "motus614" in {
                       str(c.get("name", "")).lower(),
                       str(c.get("displayName", "")).lower(),
                   }), None,
              )
              if not channel:
                  raise SystemExit("TikTok channel motus614 not found")
              return org, channel

          cached = {}
          try:
              with open("diagnostics/buffer-status.json", encoding="utf-8") as f:
                  cached = json.load(f)
          except (OSError, ValueError):
              pass

          cached_org = cached.get("organization") or {}
          cached_channel = cached.get("channel") or {}
          org = None
          channel = None
          posts = None
          if cached_org.get("id") and cached_channel.get("id"):
              org_id = cached_org["id"]
              channel_id = cached_channel["id"]
              data = gql(
                  """query MotusSnapshot($orgId: OrganizationId!, $input: PostsInput!) {
                    account { organizations { id name } }
                    channels(input: { organizationId: $orgId }) {
                      id name displayName service
                    }
                  """ + post_selection + "}",
                  {"orgId": org_id, "input": posts_input(org_id, channel_id)},
              )
              org = next(
                  (o for o in data["account"]["organizations"] if o["id"] == org_id),
                  None,
              )
              channel = next(
                  (c for c in data["channels"]
                   if c["id"] == channel_id
                   and str(c.get("service", "")).lower() == "tiktok"
                   and "motus614" in {
                       str(c.get("name", "")).lower(),
                       str(c.get("displayName", "")).lower(),
                   }), None,
              )
              if org and channel and data["posts"]["edges"]:
                  posts = data["posts"]["edges"]
                  print("BUFFER_STATUS_ONE_REQUEST")
              else:
                  print("BUFFER_STATUS_CACHE_STALE_REDISCOVER")

          if posts is None:
              org, channel = discover()
              posts = gql(
                  "query MotusPosts($input: PostsInput!) { " + post_selection + " }",
                  {"input": posts_input(org["id"], channel["id"])},
              )["posts"]["edges"]
              print("BUFFER_STATUS_DISCOVERY_FALLBACK")

          out = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "organization": {"id": org["id"], "name": org["name"]},
              "channel": {
                  "id": channel["id"],
                  "name": channel.get("displayName") or channel.get("name"),
                  "service": channel["service"],
              },
              "posts": [edge["node"] for edge in posts],
          }

          os.makedirs("diagnostics", exist_ok=True)
          with open("diagnostics/buffer-status.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write("\n")

          counts = {}
          for edge in posts:
              status = edge["node"]["status"]
              counts[status] = counts.get(status, 0) + 1

          print("BUFFER_STATUS_OK")
          print("COUNTS:", counts)
          for edge in posts[:10]:
              p = edge["node"]
              print(
                  "POST:",
                  p["status"],
                  p.get("dueAt"),
                  p.get("sentAt"),
                  p.get("externalLink"),
                  p["id"],
              )
          PY

      - name: Commit Buffer status snapshot
        if: steps.gate.outputs.should_query == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly queried Buffer snapshot outside the worktree while
          # refreshing main. This prevents non-fast-forward failures when another
          # Motus workflow commits between checkout and this step.
          cp diagnostics/buffer-status.json /tmp/buffer-status.json

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          fresh = Path("/tmp/buffer-status.json")
          target = Path("diagnostics/buffer-status.json")
          new = json.loads(fresh.read_text(encoding="utf-8"))
          old = {}
          if target.exists():
              try:
                  old = json.loads(target.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  old = {}

          if str(old.get("checked_at_utc", "")) >= str(new.get("checked_at_utc", "")):
              Path("/tmp/buffer-status-skip").write_text("remote snapshot is newer or equal", encoding="utf-8")
          else:
              shutil.copyfile(fresh, target)
          PY

            if [ -f /tmp/buffer-status-skip ]; then
              echo "BUFFER_STATUS_COMMIT_SKIPPED: remote snapshot is newer or equal"
              exit 0
            fi

            git add diagnostics/buffer-status.json
            if git diff --cached --quiet; then
              echo "BUFFER_STATUS_COMMIT_SKIPPED: no change"
              exit 0
            fi

            git commit -m "Update Buffer status snapshot"
            if git push origin HEAD:main; then
              echo "BUFFER_STATUS_COMMIT_OK"
              exit 0
            fi

            echo "BUFFER_STATUS_PUSH_RETRY: $attempt"
            sleep $((attempt * 2))
          done

          echo "BUFFER_STATUS_PUSH_FAILED after retries"
          exit 1
# manual verification trigger 2026-10-05 after recovery publish
# Read-only status refresh trigger, 2026-11-02. No publishing, renderer or scheduling changes.
# One-off read-only MOTUS Buffer publication-status refresh 2026-11-15 after hourly schedule lag; no rendering or scheduling.
# MOTUS tech read-only post-12:00 publication status refresh 2026-11-15; no content, scheduling or production changes.
# MOTUS tech read-only 18:30 publication status refresh 2026-11-15; no production or post mutations.
# One-off read-only Buffer status verification after 2026-11-16 07:00 Europe/Berlin; no video production or post changes.
# MOTUS read-only 12:00 publication verification 2026-11-16 Europe/Berlin; no renderer, production, or post mutations.
# MOTUS technical read-only dueAt and publication check, 2026-11-16 17:48 Europe/Berlin. No rendering, scheduling, or posts changed.
# MOTUS tech read-only live check 2026-11-16 19:59 Europe/Berlin for 18:30 publication; no changes to posts or production.
# MOTUS tech read-only verification for 2026-11-16 22:00 MEZ publication; no publish or production action.
# MOTUS tech read-only publication verification after 2026-11-17 07:00 Europe/Berlin; snapshot before dueAt was not evidence of failure. No production or post mutation.
# MOTUS technical one-off read-only check after 2026-11-17 12:00 Europe/Berlin; no additional production or post changes.
# MOTUS technical read-only post-18:30 MEZ verification 2026-11-17; no publishing or render mutation.
# MOTUS read-only publication verification after 2026-11-17 22:00 Europe/Berlin; no video rendering, scheduling or post mutation.
# One-off read-only Buffer verification after 2026-11-18 07:00 Europe/Berlin, to establish sent/externalLink without touching production or posts.
# MOTUS technical one-off read-only publish verification for 2026-11-18 18:30 Europe/Berlin; no video/post changes.
# MOTUS-T 2026-11-19 07:50 MEZ: one-off read-only check of post 6afd0f8b9f3765f6ab26f417 after dueAt; no rendering or post mutation.
# MOTUS-T 2026-11-19 after 12:00 MEZ: one-off read-only Buffer status refresh; no renderer, post scheduling or publishing mutation.
# MOTUS-T 2026-11-19 after 18:30 MEZ: read-only Buffer live proof refresh for existing post 6afd0fe339777dd13e0dd875; no media, post or production mutation.
