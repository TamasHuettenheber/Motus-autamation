name: Motus Dispatch Probe
run-name: Motus probe ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Probe identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm internal workflow dispatch
        run: echo "MOTUS_INTERNAL_DISPATCH_OK ${{ inputs.tag }}"
