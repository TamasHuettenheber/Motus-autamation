name: Motus Minute Watch

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional [MOTUS-DAY] issue number"
        required: false
        type: string
  push:
    paths:
      - ".github/workflows/motus-minute-watch.yml"

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: motus-minute-watch
  cancel-in-progress: true

jobs:
  watch:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[MOTUS-DAY]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check unfinished Motus day every minute
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "motus-minute-watch",
          }

          def gh(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub {method} {path} -> HTTP {exc.code}: {body[:1200]}")

          issue_number = (
              os.environ.get("EVENT_ISSUE_NUMBER")
              or os.environ.get("DISPATCH_ISSUE_NUMBER")
              or ""
          ).strip()

          if not issue_number:
              issues = gh("GET", "/issues?state=open&per_page=100&sort=created&direction=desc")
              parent = next(
                  (
                      i for i in issues
                      if not i.get("pull_request")
                      and str(i.get("title", "")).startswith("[MOTUS-DAY]")
                  ),
                  None,
              )
              if not parent:
                  print("MOTUS_MINUTE_WATCH_NO_OPEN_PARENT")
                  raise SystemExit(0)
              issue_number = str(parent["number"])

          for minute in range(340):
              issue = gh("GET", f"/issues/{issue_number}")
              title = str(issue.get("title", ""))
              if not title.startswith("[MOTUS-DAY]"):
                  print("MOTUS_MINUTE_WATCH_NOT_A_DAY_PARENT", issue_number)
                  raise SystemExit(0)

              comments = gh("GET", f"/issues/{issue_number}/comments?per_page=100")
              complete = any(
                  "MOTUS_DAY_COMPLETE" in str(c.get("body", ""))
                  for c in comments
              )

              if issue.get("state") == "closed" or complete:
                  print("MOTUS_MINUTE_WATCH_COMPLETE", issue_number, title)
                  raise SystemExit(0)

              runs = gh(
                  "GET",
                  "/actions/workflows/motus-day-status.yml/runs?per_page=20",
              ).get("workflow_runs", [])
              active = any(
                  str(r.get("status", "")) in {"queued", "in_progress"}
                  for r in runs
              )

              if active:
                  print(
                      f"MOTUS_MINUTE_WATCH minute={minute + 1}: "
                      "status reconciliation already active"
                  )
              else:
                  gh(
                      "POST",
                      "/actions/workflows/motus-day-status.yml/dispatches",
                      {"ref": "main"},
                  )
                  print(
                      f"MOTUS_MINUTE_WATCH minute={minute + 1}: "
                      "dispatched reconciliation"
                  )

              time.sleep(60)

          raise SystemExit(
              "MOTUS_MINUTE_WATCH_TIMEOUT: parent still incomplete after 340 minutes"
          )
          PY
