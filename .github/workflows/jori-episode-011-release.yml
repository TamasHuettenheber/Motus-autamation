name: Jori & Flimm — Folge 011 Buffer release

on:
  push:
    branches:
      - feature/jori-flimm-neustart-folge001
    paths:
      - .github/workflows/jori-episode-011-release.yml
      - kids/jori-flimm/relaunch-v2/episode_011_release_record.json

permissions:
  contents: read

concurrency:
  group: jori-episode-011-buffer-release
  cancel-in-progress: false

jobs:
  validate-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jori-flimm-neustart-folge001
          fetch-depth: 1
          sparse-checkout: |
            kids/jori-flimm/relaunch-v2/episode_011_release_record.json
            kids/jori-flimm/relaunch-v2/episode_011_story_draft.json
            kids/jori-flimm/relaunch-v2/audio-cache/episode-011
            kids/jori-flimm/relaunch-v2/scripts/github_followup_buffer.py
            published/jori-flimm-2026-11-01-e011-v1.mp4
      - name: Install FFmpeg probe tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify approval, independent final QC, queue proof and actual MP4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess,wave
          from pathlib import Path
          from datetime import datetime
          base=Path('kids/jori-flimm/relaunch-v2')
          r=json.loads((base/'episode_011_release_record.json').read_text(encoding='utf-8'))
          assert r['episode_number']==11 and r['title']=='Der Sternstein im blauen Saal'
          assert r['user_approved_for_publication'] is True
          assert r['status']=='READY_FOR_BUFFER'
          assert r['render_qc_passed'] is True and r['final_qc_run_id']==40839383801
          assert r['preview_run_id']==40838905570 and r['queue_check_run_id']==40839421490
          assert r['target_channel']=='@jori.flimm'
          assert datetime.fromisoformat(r['target_due_at']).isoformat(timespec='minutes')=='2026-11-01T14:00+01:00'
          p=Path(r['video_path']);assert p.is_file() and p.stat().st_size>1_000_000
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_type,codec_name,width,height','-show_entries','format=duration,size','-of','json',str(p)],text=True))
          streams=probe['streams'];assert len(streams)==2,streams
          v=next(x for x in streams if x['codec_type']=='video');a=next(x for x in streams if x['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'])==('h264',720,1280),v
          assert a['codec_name']=='aac',a
          assert abs(float(probe['format']['duration'])-126.52)<0.25,probe['format']
          timeline=json.loads((base/'audio-cache/episode-011/voice-timeline.json').read_text(encoding='utf-8'))
          pause=timeline['items'][4];assert pause['kind']=='pause' and abs(pause['duration']-7.0)<0.001,pause
          with wave.open(str(base/'audio-cache/episode-011/narration_source.wav'),'rb') as w:
              assert (w.getframerate(),w.getsampwidth(),w.getnchannels())==(24000,2,1)
              w.setpos(round(pause['start']*w.getframerate()))
              silence=w.readframes(round(7*w.getframerate()))
              assert len(silence)==7*24000*2 and not any(silence)
          proc=subprocess.run(['ffmpeg','-hide_banner','-i',str(p),'-af','silencedetect=noise=-60dB:d=6.5','-f','null','-'],capture_output=True,text=True,check=True)
          measured=[float(x) for x in re.findall(r'silence_duration:\s*([0-9.]+)',proc.stderr)]
          assert any(abs(x-7.0)<=0.2 for x in measured),measured
          print('JORI_E011_RELEASE_MP4_OK',json.dumps({'video':str(p),'duration':probe['format']['duration'],'video_codec':'H.264 720x1280','audio_codec':'AAC Sulafat','source_pause_seconds':pause['duration'],'measured_pause_seconds':measured},ensure_ascii=False))
          print('JORI_E011_APPROVAL_RECORDED',r['approval_note'])
          PY
      - name: Schedule approved episode on the verified Jori TikTok channel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_buffer.py --episode 11
