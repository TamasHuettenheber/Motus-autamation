name: Jori & Flimm – correct riddle timing in episodes 004–005
on:
  push:
    branches:
      - feature/jori-flimm-neustart-folge001
    paths:
      - .github/workflows/jori-episodes-004-005-riddle-correction.yml
permissions:
  contents: write
concurrency:
  group: jori-episodes-004-005-riddle-correction
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jori-flimm-neustart-folge001
          fetch-depth: 1
          sparse-checkout: |
            kids/jori-flimm
            published
            .github/workflows/jori-episodes-004-005-riddle-correction.yml
      - name: Install local render tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core python3-pil
      - name: Prepare Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Render, verify, and replace only the existing scheduled posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ep in 4 5; do
            echo "::group::JORI_RIDDLE_FIX_E00$ep"
            python3 -m py_compile kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer.py
            python3 - <<PY
          from pathlib import Path
          import hashlib
          from PIL import Image
          ep=$ep
          art=Path(f'kids/jori-flimm/assets/e{ep:03d}')
          imgs=[art/f'scene-{i:02d}.jpg' for i in range(1,6)]
          assert all(p.is_file() for p in imgs), imgs
          hashes=[]
          for p in imgs:
              with Image.open(p) as im:
                  assert abs(im.width/im.height-9/16)<0.02, (p,im.size)
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          assert len(set(hashes))==5, 'need five distinct episode illustrations'
          script=Path('kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer.py').read_text()
          assert 'if section=="puzzle":' in script and 'if section=="puzzle" or section=="answer":' not in script
          print(f'JORI_E00{ep}_FIVE_UNIQUE_SCENES_AND_RIDDLE_PANEL_SCOPE_OK')
          PY
            python3 kids/jori-flimm/relaunch-v2/scripts/github_restore_audio_from_existing_video.py --episode "$ep"
            python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer.py --episode "$ep"
            python3 - "$ep" <<'PY'
          import json, subprocess, sys, wave, re
          from pathlib import Path
          ep=int(sys.argv[1]); base=Path(f'work/episode_{ep:03d}')
          t=json.loads((base/'voice-timeline.json').read_text()); items=t['items']
          assert len(items)==3 and [x['kind'] for x in items]==['speech','pause','speech']
          pause=items[1]; assert abs(pause['duration']-7.0)<0.001
          with wave.open(str(base/'narration_source.wav'),'rb') as w:
              assert w.getframerate()==24000 and w.getsampwidth()==2
              w.setpos(round(pause['start']*w.getframerate()))
              raw=w.readframes(7*24000)
              assert len(raw)==7*24000*2 and not any(raw), 'source pause must be exactly seven seconds of silence'
          sub=(base/'captions.ass').read_text()
          def sec(s):
              h,m,x=s.split(':'); return int(h)*3600+int(m)*60+float(x)
          for row in sub.splitlines():
              if row.startswith('Dialogue:'):
                  c=row.split(',',9); a,b=sec(c[1]),sec(c[2])
                  assert b<=pause['start']+0.01 or a>=pause['end']-0.01, 'caption overlaps pause'
          out=Path(f'published/jori-flimm-2026-10-{21+ep:02d}-e{ep:03d}.mp4')
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_type,codec_name,width,height','-show_entries','format=duration,size','-of','json',str(out)],text=True))
          streams=p['streams']; assert len(streams)==2, streams
          v=next(s for s in streams if s['codec_type']=='video'); a=next(s for s in streams if s['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'])==('h264',720,1280),v
          assert a['codec_name']=='aac',a
          assert abs(float(p['format']['duration'])-float(t['duration']))<0.25,(p,t)
          assert int(p['format']['size'])>1_000_000
          print('JORI_RIDDLE_FIX_MP4_QC_OK',ep,json.dumps({'path':str(out),'duration':p['format']['duration'],'bytes':p['format']['size'],'video':'720x1280 H.264','audio':'AAC'},ensure_ascii=False))
          PY
            file=$(printf 'published/jori-flimm-2026-10-%02d-e%03d.mp4' "$((21+ep))" "$ep")
            git add --sparse "$file"
            git commit -m "kids: clear riddle overlay after solution in Jori episode $(printf '%03d' "$ep")"
            git pull --rebase origin feature/jori-flimm-neustart-folge001
            git push origin HEAD:feature/jori-flimm-neustart-folge001
            python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_buffer.py --episode "$ep" --replace-existing
            echo "::endgroup::"
          done
      - name: Preserve corrected episodes for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jori-Episodes-004-005-Riddle-Correction
          path: |
            published/jori-flimm-2026-10-25-e004.mp4
            published/jori-flimm-2026-10-26-e005.mp4
            work/episode_004/
            work/episode_005/
          retention-days: 14
          if-no-files-found: warn
