name: Motus Actions Smoke Test

on:
  push:
    branches: [main]
    paths:
      - action-smoke.txt

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove Actions execution
        run: |
          mkdir -p diagnostics
          printf 'GitHub Actions smoke test passed.\n' > diagnostics/action-smoke-result.txt
      - name: Commit proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/action-smoke-result.txt
          git diff --cached --quiet || (git commit -m "Motus Actions smoke test passed" && git push)
