name: Motus Renderer

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Direkte Deep-Audio MP3 URL"
        required: true
        type: string

      text:
        description: "Gesprochener und eingeblendeter Text"
        required: true
        type: string

      broll_url:
        description: "Optional: direkte MP4-B-Roll URL"
        required: false
        type: string

      output_name:
        description: "Dateiname ohne .mp4"
        required: true
        default: "motus-video"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl file fonts-dejavu-core

          mkdir -p output
          mkdir -p work
          mkdir -p published

      - name: Deep-Audio laden und normalisieren
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail

          echo "Deep-Audio wird geladen..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 180 \
            -A "Mozilla/5.0" \
            -H "Accept: audio/mpeg,audio/*;q=0.9,*/*;q=0.8" \
            "$AUDIO_URL" \
            -o work/audio_download

          test -s work/audio_download

          SIZE=$(stat -c%s work/audio_download)

          if [ "$SIZE" -lt 5000 ]; then
            echo "FEHLER: Audio-Datei ist zu klein."
            exit 1
          fi

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -y \
            -i work/audio_download \
            -vn \
            -ac 2 \
            -ar 48000 \
            -b:a 192k \
            work/voice.mp3

          ffprobe -v error work/voice.mp3

          echo "Deep-Audio erfolgreich vorbereitet."

      - name: Dauer und Text vorbereiten
        id: prep
        env:
          VIDEO_TEXT: ${{ inputs.text }}
        run: |
          set -euo pipefail

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            work/voice.mp3)

          VIDEO_DURATION=$(awk -v d="$DURATION" \
            'BEGIN {printf "%.3f", d + 1.50}')

          echo "audio_duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "video_duration=$VIDEO_DURATION" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import os
          import textwrap

          text = os.environ["VIDEO_TEXT"].strip()

          if not text:
              raise SystemExit("Video-Text ist leer.")

          wrapped = "\n".join(
              textwrap.wrap(
                  text,
                  width=34,
                  break_long_words=False,
                  break_on_hyphens=False
              )
          )

          with open("work/text.txt", "w", encoding="utf-8") as f:
              f.write(wrapped)
          PY

          echo "Audio: $DURATION Sekunden"
          echo "Video: $VIDEO_DURATION Sekunden"

      - name: B-Roll laden
        env:
          BROLL_URL: ${{ inputs.broll_url }}
        run: |
          set -euo pipefail

          if [ -n "${BROLL_URL:-}" ]; then

            echo "B-Roll wird geladen..."

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 240 \
              -A "Mozilla/5.0" \
              "$BROLL_URL" \
              -o work/broll.mp4

            test -s work/broll.mp4
            ffprobe -v error work/broll.mp4

            echo "BROLL=1" >> "$GITHUB_ENV"
            echo "B-Roll erfolgreich geladen."

          else

            echo "Keine B-Roll angegeben."
            echo "Motus-Fallback wird verwendet."
            echo "BROLL=0" >> "$GITHUB_ENV"

          fi

      - name: Motus Video rendern
        env:
          VIDEO_DURATION: ${{ steps.prep.outputs.video_duration }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          SAFE_NAME=$(echo "$OUTPUT_NAME" | tr -cd '[:alnum:]_-')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="motus-video"
          fi

          echo "safe_name=$SAFE_NAME" >> "$GITHUB_ENV"

          if [ "$BROLL" = "1" ]; then

            ffmpeg \
              -hide_banner \
              -loglevel error \
              -y \
              -stream_loop -1 \
              -i work/broll.mp4 \
              -i work/voice.mp3 \
              -filter_complex \
              "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,eq=brightness=-0.08:saturation=0.88,drawbox=x=0:y=0:w=iw:h=ih:color=black@0.18:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=work/text.txt:fontcolor=white:fontsize=52:line_spacing=16:x=(w-text_w)/2:y=430:box=1:boxcolor=black@0.42:boxborderw=30[v]" \
              -map "[v]" \
              -map 1:a:0 \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              -r 30 \
              -c:a aac \
              -b:a 192k \
              -ar 48000 \
              -movflags +faststart \
              -t "$VIDEO_DURATION" \
              "output/${SAFE_NAME}.mp4"

          else

            ffmpeg \
              -hide_banner \
              -loglevel error \
              -y \
              -f lavfi \
              -i "color=c=0x171717:s=1080x1920:r=30:d=${VIDEO_DURATION}" \
              -i work/voice.mp3 \
              -filter_complex \
              "[0:v]drawbox=x='mod(t*90,1340)-260':y=250:w=420:h=420:color=white@0.035:t=fill,drawbox=x='1080-mod(t*65,1600)':y=1120:w=520:h=520:color=white@0.025:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=work/text.txt:fontcolor=white:fontsize=52:line_spacing=16:x=(w-text_w)/2:y=430:box=1:boxcolor=black@0.35:boxborderw=30[v]" \
              -map "[v]" \
              -map 1:a:0 \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              -r 30 \
              -c:a aac \
              -b:a 192k \
              -ar 48000 \
              -movflags +faststart \
              -t "$VIDEO_DURATION" \
              "output/${SAFE_NAME}.mp4"

          fi

          test -s "output/${SAFE_NAME}.mp4"

          echo "Rendering abgeschlossen."

      - name: Qualitätskontrolle
        run: |
          set -euo pipefail

          V="output/${safe_name}.mp4"

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$V")

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$V")

          FPS=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=r_frame_rate \
            -of csv=p=0 \
            "$V")

          PIX=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=pix_fmt \
            -of csv=p=0 \
            "$V")

          VCODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$V")

          ACODEC=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$V")

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            work/voice.mp3)

          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            "$V")

          FILESIZE=$(stat -c%s "$V")

          echo "============================="
          echo "MOTUS QUALITÄTSKONTROLLE"
          echo "============================="
          echo "Auflösung: ${WIDTH}x${HEIGHT}"
          echo "FPS: $FPS"
          echo "Pixel-Format: $PIX"
          echo "Video-Codec: $VCODEC"
          echo "Audio-Codec: $ACODEC"
          echo "Audio-Dauer: $AUDIO_DURATION"
          echo "Video-Dauer: $VIDEO_DURATION"
          echo "Dateigröße: $FILESIZE Bytes"
          echo "============================="

          if [ "$WIDTH" != "1080" ]; then
            echo "FEHLER: Breite stimmt nicht."
            exit 1
          fi

          if [ "$HEIGHT" != "1920" ]; then
            echo "FEHLER: Höhe stimmt nicht."
            exit 1
          fi

          if [ "$PIX" != "yuv420p" ]; then
            echo "FEHLER: Pixel-Format stimmt nicht."
            exit 1
          fi

          if [ "$VCODEC" != "h264" ]; then
            echo "FEHLER: Video ist nicht H.264."
            exit 1
          fi

          if [ "$ACODEC" != "aac" ]; then
            echo "FEHLER: Audio ist nicht AAC."
            exit 1
          fi

          CHECK=$(awk \
            -v v="$VIDEO_DURATION" \
            -v a="$AUDIO_DURATION" \
            'BEGIN {print (v >= a + 1.0) ? 1 : 0}')

          if [ "$CHECK" != "1" ]; then
            echo "FEHLER: Video endet zu früh."
            exit 1
          fi

          if [ "$FILESIZE" -lt 100000 ]; then
            echo "FEHLER: Videodatei ist ungewöhnlich klein."
            exit 1
          fi

          echo "QUALITÄTSCHECK BESTANDEN"

      - name: MP4 als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.safe_name }}
          path: output/${{ env.safe_name }}.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Öffentliche MP4 vorbereiten
        run: |
          set -euo pipefail

          cp \
            "output/${safe_name}.mp4" \
            "published/${safe_name}.mp4"

      - name: Öffentliche MP4 speichern
        run: |
          set -euo pipefail

          git config user.name "Motus Automation"
          git config user.email "actions@users.noreply.github.com"

          git add "published/${safe_name}.mp4"

          if git diff --cached --quiet; then

            echo "Keine neue Datei zu committen."

          else

            git commit -m "Publish ${safe_name}"
            git push

          fi

      - name: Fertig
        run: |
          echo "================================"
          echo "MOTUS VIDEO FERTIG"
          echo "================================"
          echo "Datei: published/${safe_name}.mp4"
          echo "1080x1920"
          echo "H.264 + AAC"
          echo "30 FPS"
          echo "Deep-Audio"
          echo "Qualitätskontrolle bestanden"
          echo "================================"
