name: Motus Renderer
run-name: Motus ${{ inputs.output_name || github.event.issue.title }}

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Direkte Deep-Audio MP3 URL"
        required: true
        type: string
      text:
        description: "Gesprochener und eingeblendeter Text"
        required: true
        type: string
      broll_url:
        description: "Optional: direkte MP4-B-Roll URL"
        required: false
        default: ""
        type: string
      output_name:
        description: "Dateiname ohne .mp4"
        required: true
        default: "motus-video"
        type: string
      force_rerender:
        description: "Vorhandene MP4 trotz gleichem Output-Namen neu rendern"
        required: false
        default: false
        type: boolean


permissions:
  contents: write
  issues: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl file fonts-dejavu-core

      - name: Read input
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_AUDIO: ${{ inputs.audio_url }}
          DISPATCH_TEXT: ${{ inputs.text }}
          DISPATCH_BROLL: ${{ inputs.broll_url }}
          DISPATCH_OUTPUT: ${{ inputs.output_name }}
          FORCE_RERENDER: ${{ inputs.force_rerender }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          event=os.environ.get('EVENT_NAME','')
          if event=='workflow_dispatch':
              audio=os.environ.get('DISPATCH_AUDIO','').strip(); text=os.environ.get('DISPATCH_TEXT','').strip(); broll=os.environ.get('DISPATCH_BROLL','').strip(); output=os.environ.get('DISPATCH_OUTPUT','').strip()
          else:
              body=os.environ.get('ISSUE_BODY','')
              def getv(name, required=False):
                  m=re.search(rf'(?mi)^{re.escape(name)}:[ \\t]*(.*)$',body); v=m.group(1).strip() if m else ''
                  if required and not v: raise SystemExit(f'Missing required issue field: {name}')
                  return v
              audio=getv('AUDIO_URL',True); text=getv('TEXT',True); broll=getv('BROLL_URL'); output=getv('OUTPUT_NAME',True)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'AUDIO_URL={audio}\nBROLL_URL={broll}\nOUTPUT_NAME={output}\n')
              f.write('MOTUS_TEXT<<MOTUS_TEXT_EOF\n'+text+'\nMOTUS_TEXT_EOF\n')
          PY

      - name: Prepare files and audio
        run: |
          mkdir -p work published
          SAFE_NAME="$(echo "$OUTPUT_NAME" | tr -cd 'A-Za-z0-9._-')"; [ -n "$SAFE_NAME" ] || SAFE_NAME="motus-video"
          echo "SAFE_NAME=$SAFE_NAME" >> "$GITHUB_ENV"
          printf '%s\n' "$MOTUS_TEXT" > work/raw_text.txt
          curl -L --fail --retry 3 --retry-delay 2 "$AUDIO_URL" -o work/audio_source
          test -s work/audio_source
          ffmpeg -y -i work/audio_source -vn -ar 48000 -ac 2 -b:a 192k work/audio.mp3
          AUDIO_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 work/audio.mp3)"
          VIDEO_DURATION="$(python3 - <<PY
          a=float('$AUDIO_DURATION'); print(f'{a+0.35:.3f}')
          PY
          )"
          echo "AUDIO_DURATION=$AUDIO_DURATION" >> "$GITHUB_ENV"
          echo "VIDEO_DURATION=$VIDEO_DURATION" >> "$GITHUB_ENV"
          MUSIC_URL="https://raw.githubusercontent.com/tannerhelland/free-music/master/mp3/Now%20or%20Never.mp3"
          curl -L --fail --retry 3 --retry-delay 2 "$MUSIC_URL" -o work/music_source.mp3
          ffmpeg -y -stream_loop -1 -i work/music_source.mp3 -t "$VIDEO_DURATION" -ar 48000 -ac 2 -b:a 192k work/music.mp3
          test -s work/music.mp3
          echo "MOTUS_MUSIC_PRESENT=true" >> "$GITHUB_ENV"

      - name: Build timed safe-zone captions
        run: |
          python3 - <<'PY'
          import os,re,textwrap
          text=os.environ['MOTUS_TEXT'].strip(); dur=float(os.environ['AUDIO_DURATION'])
          # Split into short spoken units; never show the full transcript at once.
          raw=[x.strip() for x in re.split(r'(?<=[.!?])\s+|\s*[;:]\s+|\s+[–—]\s+',text) if x.strip()]
          chunks=[]
          for part in raw:
              words=part.split()
              while len(words)>10:
                  cut=min(9,len(words)); chunks.append(' '.join(words[:cut])); words=words[cut:]
              if words: chunks.append(' '.join(words))
          if not chunks: chunks=[text]
          weights=[max(1,len(c.split())) for c in chunks]; total=sum(weights)
          def ts(sec):
              h=int(sec//3600); sec-=h*3600; m=int(sec//60); sec-=m*60
              return f'{h}:{m:02d}:{sec:05.2f}'
          def esc(s): return s.replace('{','\\{').replace('}','\\}')
          ass='''[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\nScaledBorderAndShadow: yes\n\n[V4+ Styles]\nFormat: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\nStyle: Motus,DejaVu Sans,62,&H00FFFFFF,&H000000FF,&H00151515,&H99000000,-1,0,0,0,100,100,0,0,3,2,0,8,115,115,420,1\n\n[Events]\nFormat: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n'''
          t=0.0
          for i,(c,w) in enumerate(zip(chunks,weights)):
              end=dur if i==len(chunks)-1 else t+dur*w/total
              wrapped='\\N'.join(textwrap.wrap(c,width=24,break_long_words=False,break_on_hyphens=False))
              ass+=f'Dialogue: 0,{ts(t)},{ts(end)},Motus,,0,0,0,,{esc(wrapped)}\n'; t=end
          open('work/captions.ass','w',encoding='utf-8').write(ass)
          print(f'Caption chunks: {len(chunks)}')
          PY

      - name: Select and download B-roll
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def fold(s):
              return s.lower().replace('ä','ae').replace('ö','oe').replace('ü','ue').replace('ß','ss')

          text=fold(os.environ.get('MOTUS_TEXT',''))
          output=os.environ.get('OUTPUT_NAME','motus')
          explicit=os.environ.get('BROLL_URL','').strip()
          library=json.loads(Path('config/broll-library.json').read_text(encoding='utf-8'))
          history_path=Path('diagnostics/broll-history.json')
          try:
              history=json.loads(history_path.read_text(encoding='utf-8')) if history_path.exists() else {"uses":[]}
          except json.JSONDecodeError as exc:
              print(f'BROLL_HISTORY_WARNING: invalid JSON ignored: {exc}')
              history={"uses":[]}
          recent_ids=[x.get("clip_id") for x in history.get("uses",[])[-8:] if x.get("clip_id")]
          ranked=[]
          for clip in library.get('clips',[]):
              score=sum(1 for tag in clip.get('tags',[]) if fold(str(tag)) in text)
              cooldown=1 if clip['id'] in recent_ids else 0
              tie=int(hashlib.sha256((output+'|'+clip['id']).encode()).hexdigest()[:12],16)
              ranked.append((cooldown,score,tie,clip))
          # Hard cooldown first: a clip used in the last 8 successful Motus renders loses
          # to every unused clip, even if its topic score is higher.
          ranked.sort(key=lambda x:(x[0],-x[1],x[2]))

          candidates=[]
          seen=set()
          if explicit:
              matched=next(
                  (clip for clip in library.get('clips',[])
                   if clip.get('direct_url','').strip()==explicit),
                  None,
              )
              if matched:
                  if matched['id'] in recent_ids:
                      print(f"BROLL_COOLDOWN_SKIP: explicit clip {matched['id']} was used within the last 8 renders; selecting a fresh library candidate instead")
                  else:
                      candidates.append((matched['id'],explicit,matched.get('source_page',''),999))
                      seen.add(explicit)
              else:
                  explicit_id='explicit-'+hashlib.sha256(explicit.encode()).hexdigest()[:12]
                  candidates.append((explicit_id,explicit,'explicit-url',999))
              seen.add(explicit)
          for _,score,_,clip in ranked:
              url=clip.get('direct_url','').strip()
              if not url or url in seen:
                  continue
              candidates.append((clip['id'],url,clip.get('source_page',''),score))
              seen.add(url)
              if len(candidates) >= (4 if explicit else 3):
                  break
          if not candidates:
              raise SystemExit('No B-roll candidates available')

          with open('work/broll_candidates.tsv','w',encoding='utf-8') as f:
              for cid,url,source,score in candidates:
                  f.write(f'{cid}\t{url}\t{source}\t{score}\n')
          print('BROLL_CANDIDATES:', ', '.join(f'{cid}[score={score}]' for cid,_,_,score in candidates))
          PY

          READY=false
          ATTEMPT=0
          SELECTED_ID=""
          SELECTED_SOURCE=""
          while IFS=$'\t' read -r ID URL SOURCE SCORE; do
            ATTEMPT=$((ATTEMPT+1))
            echo "BROLL_TRY: attempt=$ATTEMPT id=$ID score=$SCORE"
            rm -f work/broll_try.mp4
            if curl -L --fail --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 90 "$URL" -o work/broll_try.mp4 && test -s work/broll_try.mp4 && ffprobe -v error work/broll_try.mp4 >/dev/null 2>&1; then
              mv work/broll_try.mp4 work/broll.mp4
              READY=true
              SELECTED_ID="$ID"
              SELECTED_SOURCE="$SOURCE"
              echo "BROLL_SELECTED: id=$ID attempt=$ATTEMPT source=$SOURCE"
              break
            fi
            echo "BROLL_REJECTED: id=$ID attempt=$ATTEMPT"
          done < work/broll_candidates.tsv
          rm -f work/broll_try.mp4
          echo "BROLL_READY=$READY" >> "$GITHUB_ENV"
          echo "BROLL_SELECTED_ID=$SELECTED_ID" >> "$GITHUB_ENV"
          echo "BROLL_SELECTED_SOURCE=$SELECTED_SOURCE" >> "$GITHUB_ENV"
          echo "BROLL_ATTEMPTS=$ATTEMPT" >> "$GITHUB_ENV"
          if [ "$READY" != "true" ]; then
            echo "BROLL_REQUIRED: no moving B-roll candidate succeeded; no fallback will be published"
          fi

      - name: Reuse published QC video
        id: reuse
        run: |
          URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/published/$SAFE_NAME.mp4"
          if [ "$FORCE_RERENDER" = "true" ]; then
            rm -f "work/$SAFE_NAME.mp4"
            echo "REUSE_EXISTING=false" >> "$GITHUB_ENV"
            echo "FORCE_RERENDER=true: existing published MP4 will be replaced after QC"
          elif curl -L --fail --silent --show-error "$URL" -o "work/$SAFE_NAME.mp4" && test -s "work/$SAFE_NAME.mp4" && ffprobe -v error "work/$SAFE_NAME.mp4" >/dev/null 2>&1; then
            echo "REUSE_EXISTING=true" >> "$GITHUB_ENV"
            echo "REUSE_EXISTING=true"
          else
            rm -f "work/$SAFE_NAME.mp4"
            echo "REUSE_EXISTING=false" >> "$GITHUB_ENV"
          fi

      - name: Render with B-roll
        if: env.REUSE_EXISTING != 'true' && env.BROLL_READY == 'true'
        run: |
          timeout 180 ffmpeg -y -stream_loop 1 -i work/broll.mp4 -i work/audio.mp3 -stream_loop -1 -i work/music.mp3 -t "$VIDEO_DURATION" -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,eq=brightness=-0.08:saturation=0.90,drawbox=x=0:y=0:w=iw:h=ih:color=black@0.12:t=fill,subtitles=work/captions.ass[v];[1:a]volume=1.0[voice];[2:a]volume=0.26,afade=t=in:st=0:d=0.6[music];[voice][music]amix=inputs=2:duration=first:dropout_transition=0[a]" -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -r 30 -c:a aac -b:a 192k -movflags +faststart -shortest "work/$SAFE_NAME.mp4"

      - name: Reject missing moving B-roll
        if: env.REUSE_EXISTING != 'true' && env.BROLL_READY != 'true'
        run: |
          echo "BROLL_REQUIRED: no valid moving B-roll candidate succeeded; diagnostic fallback is not publishable"
          exit 1

      - name: Quality control
        run: |
          VIDEO="work/$SAFE_NAME.mp4"; test -s "$VIDEO"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          PIXFMT="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO")"
          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          test "${MOTUS_MUSIC_PRESENT:-}" = "true"
          FINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          FILE_SIZE="$(stat -c%s "$VIDEO")"
          test "$WIDTH" = "1080"; test "$HEIGHT" = "1920"; test "$CODEC" = "h264"; test "$PIXFMT" = "yuv420p"; test "$AUDIO_CODEC" = "aac"; test "$FILE_SIZE" -ge 100000
          python3 - <<'PY'
          from pathlib import Path
          for line in Path("work/captions.ass").read_text(encoding="utf-8").splitlines():
              if line.startswith("Dialogue:"):
                  caption=line.rsplit(",,",1)[-1]
                  # ASS uses \\N as a valid line-break control. Any other backslash is forbidden.
                  probe=caption.replace("\\\\N","").replace("\\\\{","").replace("\\\\}","")
                  if "\\\\" in probe:
                      raise SystemExit("QC failed: stray literal backslash in captions")
          print("Caption QC passed: no stray literal backslashes")
          PY
          python3 - <<PY
          a=float('$AUDIO_DURATION'); v=float('$FINAL_DURATION')
          if v < a-0.25: raise SystemExit(f'QC failed: video {v:.2f}s, audio {a:.2f}s')
          print(f'QC passed: audio={a:.2f}s video={v:.2f}s')
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}
          path: work/${{ env.SAFE_NAME }}.mp4
          retention-days: 7

      - name: Publish MP4 to repository
        run: |
          if [ "$REUSE_EXISTING" = "true" ]; then echo "REUSE_PUBLISH: existing published MP4 retained"; else cp "work/$SAFE_NAME.mp4" "published/$SAFE_NAME.mp4"; fi
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('diagnostics/broll-history.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {"uses":[]}
          d.setdefault("uses",[]).append({
              "output_name": os.environ.get("SAFE_NAME",""),
              "clip_id": os.environ.get("BROLL_SELECTED_ID","") or "animated-fallback",
              "source": os.environ.get("BROLL_SELECTED_SOURCE",""),
              "used_at_utc": datetime.now(timezone.utc).isoformat()
          })
          d["uses"]=d["uses"][-100:]
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Discard the advisory history edit made earlier in this step before rebasing.
          # The MP4 is the critical output and must never be blocked by diagnostics.
          git restore diagnostics/broll-history.json 2>/dev/null || true
          if [ "$REUSE_EXISTING" != "true" ]; then
            git add "published/$SAFE_NAME.mp4"
            if ! git diff --cached --quiet; then
              git commit -m "Publish $SAFE_NAME"
              for attempt in 1 2 3; do
                git pull --rebase origin main && git push && break
                if [ "$attempt" -eq 3 ]; then exit 1; fi
                git rebase --abort 2>/dev/null || true
                sleep 3
              done
            fi
          else
            echo "REUSE_PUBLISH_GIT_SKIP: published MP4 already exists on main; no pathspec/add required"
          fi
          # B-roll history is advisory only. Refresh it after the MP4 push and never
          # fail the production if another parallel run changed the same JSON file.
          git reset --hard origin/main
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('diagnostics/broll-history.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {"uses":[]}
          if not any(x.get("output_name")==os.environ.get("SAFE_NAME","") for x in d.get("uses",[])):
              d.setdefault("uses",[]).append({
                  "output_name": os.environ.get("SAFE_NAME",""),
                  "clip_id": os.environ.get("BROLL_SELECTED_ID","") or "animated-fallback",
                  "source": os.environ.get("BROLL_SELECTED_SOURCE",""),
                  "used_at_utc": datetime.now(timezone.utc).isoformat()
              })
          d["uses"]=d["uses"][-100:]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          PY
          git add diagnostics/broll-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update B-roll history for $SAFE_NAME"
            git pull --rebase origin main && git push || echo "BROLL_HISTORY_WARNING: non-critical history update skipped"
          fi

      - name: Schedule Motus video in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          key = os.environ.get("BUFFER_API_KEY", "").strip()
          safe_name = os.environ.get("SAFE_NAME", "").strip()
          text = os.environ.get("MOTUS_TEXT", "").strip()
          text = text + "\n\nMusik: Tanner Helland – Now or Never (CC BY 4.0)"
          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()

          if not key:
              raise SystemExit("BUFFER_API_KEY secret is missing")

          # Only production-style filenames are auto-scheduled.
          # Test renders such as motus-connector-live-test-3 are left untouched.
          m = re.fullmatch(r"motus-(\d{4}-\d{2}-\d{2})-(\d{4})", safe_name)
          if not m:
              print(f"Buffer scheduling skipped: {safe_name!r} is not a dated Motus production slot")
              raise SystemExit(0)

          date_part, hm = m.groups()
          local_due = datetime.strptime(
              f"{date_part} {hm[:2]}:{hm[2:]}",
              "%Y-%m-%d %H:%M",
          ).replace(tzinfo=ZoneInfo("Europe/Berlin"))
          due = local_due.astimezone(timezone.utc)
          due_at = due.isoformat(timespec="milliseconds").replace("+00:00", "Z")

          if due.timestamp() <= time.time() + 120:
              print(f"Buffer scheduling skipped: slot {local_due.isoformat()} is already past or too close")
              raise SystemExit(0)

          media_url = f"https://raw.githubusercontent.com/{repo}/main/published/{safe_name}.mp4"
          api = "https://api.buffer.com"

          def buffer_request(query, variables=None):
              payload = {"query": query}
              if variables is not None:
                  payload["variables"] = variables
              req = urllib.request.Request(
                  api,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {key}",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"Buffer HTTP {exc.code}: {body[:1000]}")
              if result.get("errors"):
                  raise RuntimeError("Buffer GraphQL error: " + json.dumps(result["errors"], ensure_ascii=False))
              return result["data"]

          # The video has just been committed. Wait until the public raw URL is reachable.
          last_error = None
          for attempt in range(12):
              try:
                  req = urllib.request.Request(media_url, method="HEAD")
                  with urllib.request.urlopen(req, timeout=30) as response:
                      if response.status == 200:
                          print(
                              "MEDIA_URL_OK:",
                              response.status,
                              response.headers.get("Content-Type"),
                              response.headers.get("Content-Length"),
                          )
                          break
              except Exception as exc:
                  last_error = exc
              if attempt == 11:
                  raise RuntimeError(f"Published MP4 did not become reachable: {last_error}")
              time.sleep(5)

          orgs = buffer_request("""
          query {
            account {
              organizations {
                id
                name
              }
            }
          }
          """)["account"]["organizations"]
          if not orgs:
              raise RuntimeError("No Buffer organization found")
          org = orgs[0]

          channels = buffer_request(
              """
              query Channels($orgId: OrganizationId!) {
                channels(input: { organizationId: $orgId }) {
                  id
                  name
                  displayName
                  service
                }
              }
              """,
              {"orgId": org["id"]},
          )["channels"]

          channel = next(
              (
                  c for c in channels
                  if str(c.get("service", "")).lower() == "tiktok"
                  and "motus614" in {
                      str(c.get("name", "")).lower(),
                      str(c.get("displayName", "")).lower(),
                  }
              ),
              None,
          )
          if not channel:
              raise RuntimeError("TikTok channel motus614 not found")

          # Idempotency: if a retry already scheduled this exact Motus media URL,
          # remove the old scheduled copy so Buffer refetches the newly rendered file.
          scheduled = buffer_request(
              """
              query ScheduledPosts($input: PostsInput!) {
                posts(first: 100, input: $input) {
                  edges {
                    node {
                      id
                      dueAt
                      assets {
                        source
                      }
                    }
                  }
                }
              }
              """,
              {
                  "input": {
                      "organizationId": org["id"],
                      "filter": {
                          "status": ["scheduled"],
                          "channelIds": [channel["id"]],
                      },
                  }
              },
          )["posts"]["edges"]

          for edge in scheduled:
              post = edge["node"]
              sources = {str(a.get("source") or "") for a in (post.get("assets") or [])}
              if media_url in sources:
                  deleted = buffer_request(
                      """
                      mutation DeletePost($input: DeletePostInput!) {
                        deletePost(input: $input) {
                          __typename
                          ... on DeletePostSuccess { id }
                          ... on MutationError { message }
                        }
                      }
                      """,
                      {"input": {"id": post["id"]}},
                  )["deletePost"]
                  if deleted.get("__typename") != "DeletePostSuccess":
                      raise RuntimeError(
                          "Could not replace existing Motus scheduled post: "
                          + json.dumps(deleted, ensure_ascii=False)
                      )
                  print("Removed previous scheduled copy:", post["id"])

          create_query = """
              mutation CreatePost($input: CreatePostInput!) {
                createPost(input: $input) {
                  __typename
                  ... on PostActionSuccess {
                    post {
                      id
                      status
                      dueAt
                      channelId
                      assets {
                        mimeType
                        source
                      }
                    }
                  }
                  ... on MutationError { message }
                }
              }
              """
          create_variables = {
              "input": {
                  "text": text,
                  "channelId": channel["id"],
                  "schedulingType": "automatic",
                  "mode": "customScheduled",
                  "dueAt": due_at,
                  "aiAssisted": True,
                  "metadata": {"tiktok": {"isAiGenerated": True}},
                  "assets": [
                      {
                          "video": {
                              "url": media_url,
                              "metadata": {"thumbnailOffset": 1000},
                          }
                      }
                  ],
              }
          }

          created = None
          for create_attempt in range(1, 6):
              created = buffer_request(create_query, create_variables)["createPost"]
              if created.get("__typename") == "PostActionSuccess" and created.get("post"):
                  break
              message = str(created.get("message") or "")
              if "Video could not be read from its URL" in message and create_attempt < 5:
                  wait_seconds = 15 * create_attempt
                  print(f"BUFFER_MEDIA_PROPAGATION_RETRY: attempt={create_attempt} wait={wait_seconds}s")
                  time.sleep(wait_seconds)
                  continue
              break

          if created.get("__typename") != "PostActionSuccess" or not created.get("post"):
              raise RuntimeError("Buffer scheduling failed: " + json.dumps(created, ensure_ascii=False))

          post = created["post"]
          if post.get("status") != "scheduled":
              raise RuntimeError(f"Buffer returned unexpected status: {post.get('status')}")
          if post.get("dueAt") != due_at:
              raise RuntimeError(f"Buffer dueAt mismatch: expected {due_at}, got {post.get('dueAt')}")
          if post.get("channelId") != channel["id"]:
              raise RuntimeError("Buffer scheduled the post to the wrong channel")
          if not any(
              str(a.get("mimeType") or "").startswith("video/")
              for a in (post.get("assets") or [])
          ):
              raise RuntimeError("Buffer did not recognize the Motus MP4 as a video asset")

          print("BUFFER_POST_SCHEDULED:", post["id"])
          print("BUFFER_CHANNEL:", channel["displayName"], channel["id"])
          print("BUFFER_DUE_LOCAL:", local_due.isoformat())
          print("BUFFER_DUE_UTC:", due_at)
          print("BUFFER_MEDIA:", media_url)
          PY


      - name: Trigger Motus day reconciliation
        if: always() && github.event_name == 'workflow_dispatch' && startsWith(inputs.output_name, 'motus-20')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/motus-day-status.yml/dispatches" \
            -d '{"ref":"main"}'
