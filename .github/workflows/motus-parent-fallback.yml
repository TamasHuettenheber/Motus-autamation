name: Motus Parent Fallback

on:
  push:
    paths:
      - "requests/motus-day-*.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  create-parent-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Create exactly one Motus parent from queued request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          api=f"https://api.github.com/repos/{repo}"
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"motus-parent-fallback",
          }

          def gh(method,path,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode("utf-8")
              req=urllib.request.Request(api+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=60) as resp:
                      raw=resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode("utf-8","replace")
                  raise RuntimeError(f"GitHub {method} {path} -> HTTP {exc.code}: {body[:1500]}")

          requests=sorted(Path("requests").glob("motus-day-*.json"))
          if not requests:
              print("NO_MOTUS_PARENT_REQUEST")
              raise SystemExit(0)

          for req_path in requests:
              batch=json.loads(req_path.read_text(encoding="utf-8"))
              date=str(batch.get("date","")).strip()
              slots=batch.get("slots")
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}",date):
                  raise SystemExit(f"{req_path}: invalid date")
              if not isinstance(slots,list) or len(slots)!=4:
                  raise SystemExit(f"{req_path}: exactly four slots required")
              title=f"[MOTUS-DAY] {date}"

              q=urllib.parse.quote(f'repo:{repo} is:issue in:title "{title}"')
              search=gh("GET",f"/issues?state=all&per_page=100&sort=created&direction=desc")
              exact=next((i for i in search if not i.get("pull_request") and str(i.get("title",""))==title),None)

              if exact:
                  issue_number=int(exact["number"])
                  print("PARENT_ALREADY_EXISTS",issue_number,title)
              else:
                  issue=gh("POST","/issues",{
                      "title":title,
                      "body":json.dumps({"date":date,"slots":slots},ensure_ascii=False,separators=(",",":")),
                  })
                  issue_number=int(issue["number"])
                  print("PARENT_CREATED",issue_number,title)

              gh("POST","/actions/workflows/motus-day.yml/dispatches",{
                  "ref":"main",
                  "inputs":{"issue_number":str(issue_number)},
              })
              print("BATCH_DISPATCHED",issue_number,title)
          PY
