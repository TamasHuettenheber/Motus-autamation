name: Jori & Flimm Renderer
run-name: Kids episode #${{ inputs.issue_number || 'Episode 000 test' }}

on:
  push:
    branches:
      - feature/jori-flimm-kids-pipeline
    paths:
      - kids/jori-flimm/test-payload-episode-000.json
      - kids/jori-flimm/episodes/*.json
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number containing a [JORI-FLIMM-DAY] JSON payload"
        required: true
        type: string

permissions:
  contents: write
  issues: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Validate isolated branch
        env:
          RUN_REF: ${{ github.ref_name }}
        run: |
          test "$RUN_REF" = "feature/jori-flimm-kids-pipeline"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl fonts-dejavu-core python3-venv
          mkdir -p work

      - name: Load and validate episode payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, unicodedata, urllib.request
          from datetime import date

          if os.environ["EVENT_NAME"] == "push":
              import subprocess
              changed=subprocess.check_output(
                  ["git","diff-tree","--no-commit-id","--name-only","-r","HEAD^","HEAD"],
                  text=True
              ).splitlines()
              candidates=[
                  path for path in changed
                  if path == "kids/jori-flimm/test-payload-episode-000.json"
                  or (path.startswith("kids/jori-flimm/episodes/") and path.endswith(".json"))
              ]
              if len(candidates)!=1:
                  raise SystemExit(f"Expected one episode payload in commit, found {len(candidates)}")
              with open(candidates[0],encoding="utf-8") as f:
                  p=json.load(f)
          else:
              repo=os.environ["REPO"]
              num=str(os.environ["ISSUE_NUMBER"]).strip()
              if not re.fullmatch(r"\d+",num):
                  raise SystemExit("Issue number must be numeric")
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{num}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"jori-flimm-renderer"
                  }
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  issue=json.loads(r.read().decode("utf-8"))
              if not str(issue.get("title","")).startswith("[JORI-FLIMM-DAY]"):
                  raise SystemExit("Issue is not a [JORI-FLIMM-DAY] payload")
              try:
                  p=json.loads(issue.get("body") or "")
              except json.JSONDecodeError as e:
                  raise SystemExit(f"Body must be pure JSON: {e}")

          required=["date","episode_number","title","hook","narration","riddle","scenes","publish_time","qc"]
          for k in required:
              if k not in p:
                  raise SystemExit(f"Missing field: {k}")
          try:
              date.fromisoformat(str(p["date"]))
          except ValueError:
              raise SystemExit("Invalid date")
          if not isinstance(p["episode_number"],int) or p["episode_number"] < 0:
              raise SystemExit("Invalid episode_number")
          if not isinstance(p["title"],str) or len(p["title"].strip()) < 3:
              raise SystemExit("Invalid title")
          if not isinstance(p["hook"],str) or len(p["hook"].strip()) < 3:
              raise SystemExit("Invalid hook")
          if not re.fullmatch(r"([01]\d|2[0-3]):[0-5]\d",str(p["publish_time"])):
              raise SystemExit("Invalid publish_time")
          riddle=p["riddle"]
          for key in ["type","question","answer","pause_seconds"]:
              if key not in riddle:
                  raise SystemExit(f"Missing riddle field: {key}")
          if not 2 <= float(riddle["pause_seconds"]) <= 10:
              raise SystemExit("Invalid riddle pause")
          if p.get("audio_url") and not str(p["audio_url"]).startswith("https://"):
              raise SystemExit("audio_url must be https when provided")
          scenes=p["scenes"]
          if not isinstance(scenes,list) or not 5 <= len(scenes) <= 10:
              raise SystemExit("scenes must contain 5-10 items")
          total=0.0
          for i,s in enumerate(scenes,1):
              if not str(s.get("image_url","")).startswith("https://"):
                  raise SystemExit(f"Scene {i}: image_url must be https")
              d=float(s.get("duration_seconds",0))
              if not 4 <= d <= 20:
                  raise SystemExit(f"Scene {i}: duration must be 4-20 seconds")
              total += d
          if total < 40 or total > 110:
              raise SystemExit(f"Scene timeline out of bounds: {total}s")

          if not isinstance(p.get("narration"),str) or len(p["narration"].strip()) < 30:
              raise SystemExit("Narration must contain at least 30 characters")
          if not isinstance(p.get("riddle"),dict):
              raise SystemExit("Missing riddle")
          pause_markers=re.findall(r"\[\[PAUSE:([0-9]+(?:\.[0-9]+)?)\]\]",p["narration"])
          if len(pause_markers)>1:
              raise SystemExit("Only one explicit pause marker is supported")
          if pause_markers and abs(float(pause_markers[0])-float(p["riddle"]["pause_seconds"]))>0.01:
              raise SystemExit("Pause marker must match riddle.pause_seconds")
          if float(p["riddle"]["pause_seconds"])>=5 and not p.get("audio_url") and len(pause_markers)!=1:
              raise SystemExit("A 5-10 second riddle pause needs an explicit narration marker")
          qc=p.get("qc") or {}
          for key in ["book_spoiler_check","continuity_check","duplicate_check"]:
              if qc.get(key) is not True:
                  raise SystemExit(f"QC gate not true: {key}")

          def fingerprint(value):
              value=unicodedata.normalize("NFKC",str(value)).casefold()
              return re.sub(r"[^\w]+"," ",value).strip()
          ledger_path="kids/jori-flimm/state/episode-ledger.json"
          if os.path.exists(ledger_path):
              with open(ledger_path,encoding="utf-8") as f:
                  previous=json.load(f).get("episodes",[])
              for old in previous:
                  if int(old.get("episode_number",-1)) == int(p["episode_number"]):
                      continue
                  old_riddle=old.get("riddle") or {}
                  if fingerprint(old.get("title","")) == fingerprint(p["title"]):
                      raise SystemExit("Duplicate episode title")
                  if fingerprint(old.get("hook","")) == fingerprint(p.get("hook","")):
                      raise SystemExit("Duplicate episode hook")
                  if fingerprint(old_riddle.get("question","")) == fingerprint(p["riddle"].get("question","")):
                      raise SystemExit("Duplicate riddle question")

          safe=f"jori-flimm-{p['date']}-e{int(p['episode_number']):03d}"
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write(f"SAFE_NAME={safe}\n")
          os.makedirs("work",exist_ok=True)
          with open("work/payload.json","w",encoding="utf-8") as f:
              json.dump(p,f,ensure_ascii=False,indent=2)
          print(f"Validated {len(scenes)} scenes, {total:.1f}s")
          PY

      - name: Generate narration and download stills
        run: |
          mkdir -p work/scenes
          python3 - <<'PY'
          import json, subprocess
          from urllib.request import Request, urlopen

          with open("work/payload.json",encoding="utf-8") as f:
              p=json.load(f)
          if p.get("audio_url"):
              req=Request(p["audio_url"],headers={"User-Agent":"jori-flimm-renderer"})
              with urlopen(req,timeout=60) as response:
                  audio=response.read(25*1024*1024+1)
              if len(audio)>25*1024*1024:
                  raise SystemExit("Narration audio exceeds 25 MiB")
              with open("work/audio_source","wb") as f:
                  f.write(audio)
              subprocess.run(["ffmpeg","-y","-i","work/audio_source","-vn","-ar","48000","-ac","2","-b:a","192k","work/narration.mp3"],check=True)
          else:
              with open("work/narration.txt","w",encoding="utf-8") as f:
                  f.write(p["narration"].strip()+"\n")
              subprocess.run(
                  ["python3","kids/jori-flimm/scripts/generate_voice.py"],
                  check=True
              )
              subprocess.run([
                  "ffmpeg","-y","-i","work/narration_source.wav",
                  "-af","volume=0.95,highpass=f=75,equalizer=f=180:t=q:w=1:g=0.5,equalizer=f=3200:t=q:w=1:g=-0.4,alimiter=limit=0.95",
                  "-ar","48000","-ac","2","-b:a","192k","work/narration.mp3"
              ],check=True)

          scene_files=[]
          extensions={"image/png":".png","image/jpeg":".jpg","image/webp":".webp"}
          for i,scene in enumerate(p["scenes"],1):
              req=Request(scene["image_url"],headers={"User-Agent":"jori-flimm-renderer"})
              with urlopen(req,timeout=60) as response:
                  content_type=response.headers.get_content_type()
                  extension=extensions.get(content_type)
                  if not extension:
                      raise SystemExit(f"Scene {i}: unsupported image type {content_type}")
                  image=response.read(20*1024*1024+1)
              if len(image)>20*1024*1024:
                  raise SystemExit(f"Scene {i}: image exceeds 20 MiB")
              out=f"work/scenes/{i:02d}{extension}"
              with open(out,"wb") as f:
                  f.write(image)
              scene_files.append(out)
          with open("work/scene-files.json","w",encoding="utf-8") as f:
              json.dump(scene_files,f)
          PY

      - name: Build safe-zone subtitles
        run: |
          python3 - <<'PY'
          import json,os,re,textwrap
          timeline_path="work/voice-timeline.json"
          dialogue=[]
          def ts(sec):
              h=int(sec//3600); sec-=h*3600; m=int(sec//60); sec-=m*60
              return f"{h}:{m:02d}:{sec:05.2f}"
          if os.path.exists(timeline_path):
              timeline=json.load(open(timeline_path,encoding="utf-8"))["items"]
              for item in timeline:
                  if item["kind"]=="pause":
                      if float(item["duration"])>=5 and dialogue:
                          dialogue[-1]["end"]=float(item["end"])
                      continue
                  words=item["text"].split()
                  chunks=[]
                  while len(words)>9:
                      chunks.append(words[:9]); words=words[9:]
                  if words: chunks.append(words)
                  weights=[max(1,len(c)) for c in chunks]
                  total=sum(weights)
                  elapsed=0.0
                  for chunk,weight in zip(chunks,weights):
                      start=float(item["start"])+float(item["duration"])*elapsed/total
                      elapsed+=weight
                      finish=float(item["start"])+float(item["duration"])*elapsed/total
                      dialogue.append({"text":" ".join(chunk),"start":start,"end":finish})
          else:
              with open("work/payload.json",encoding="utf-8") as f:
                  narration=json.load(f)["narration"]
          narration=re.sub(r"\[\[PAUSE:[0-9]+(?:\.[0-9]+)?\]\]","",narration).strip()
              dur=float(os.environ["AUDIO_DURATION"])
          parts=[x.strip() for x in re.split(r"(?<=[.!?])\s+|\s*[;:]\s+",narration) if x.strip()]
              chunks=[]
              for part in parts:
                  words=part.split()
                  while len(words)>9:
                      chunks.append(" ".join(words[:9])); words=words[9:]
                  if words: chunks.append(" ".join(words))
              if not chunks: chunks=[narration]
              weights=[max(1,len(c.split())) for c in chunks]
              total=sum(weights)
              elapsed=0.0
              for chunk,weight in zip(chunks,weights):
                  start=dur*elapsed/total; elapsed+=weight; finish=dur*elapsed/total
                  dialogue.append({"text":chunk,"start":start,"end":finish})
          ass="""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Kids,DejaVu Sans,56,&H00FFFFFF,&H000000FF,&H80131B28,&H00000000,-1,0,0,0,100,100,0,0,1,4,2,2,90,90,250,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          """
          ass="\\n".join(line.strip() for line in ass.splitlines())+"\\n"
          for cue in dialogue:
              wrapped="\\\\N".join(textwrap.wrap(cue["text"],width=25,break_long_words=False,break_on_hyphens=False))
              wrapped=wrapped.replace("{","\\\\{").replace("}","\\\\}")
              ass+=f"Dialogue: 0,{ts(cue['start'])},{ts(cue['end'])},Kids,,0,0,0,,{wrapped}\\n"
          open("work/captions.ass","w",encoding="utf-8").write(ass)
          PY

      - name: Render animated still-image segments
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          p=json.load(open("work/payload.json",encoding="utf-8"))
          scene_files=json.load(open("work/scene-files.json",encoding="utf-8"))
          requested_total=sum(float(s["duration_seconds"]) for s in p["scenes"])
          audio_duration=float(subprocess.check_output([
              "ffprobe","-v","error","-show_entries","format=duration",
              "-of","default=noprint_wrappers=1:nokey=1","work/narration.mp3"
          ],text=True))
          target_total=max(45.0,audio_duration+2.2)
          if target_total-audio_duration>8.0:
              raise SystemExit(f"Narration is too short for a 45-second short: {audio_duration:.1f}s")
          if target_total>100:
              raise SystemExit(f"Narration is too long: {audio_duration:.1f}s")
          scale=target_total/requested_total
          segments=[]
          for i,s in enumerate(p["scenes"],1):
              d=float(s["duration_seconds"])*scale
              if not 4 <= d <= 20:
                  raise SystemExit(f"Scaled scene {i} duration out of range: {d:.1f}s")
              src=scene_files[i-1]
              dst=f"work/scenes/{i:02d}.mp4"
              frames=max(1,int(round(d*30)))
              # Alternating zoom direction adds motion without AI video generation.
              if i % 2:
                  zp=f"zoompan=z='min(zoom+0.00033,1.10)':x='(iw-iw/zoom)*on/{frames}':y='(ih-ih/zoom)/2'"
              else:
                  zp=f"zoompan=z='max(1.0,1.10-on*0.00033)':x='(iw-iw/zoom)*(1-on/{frames})':y='(ih-ih/zoom)/2'"
              vf=(
                  "scale=1080:1920:force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  +zp+f":d={frames}:s=1080x1920:fps=30,"
                  "format=yuv420p"
              )
              subprocess.run([
                  "ffmpeg","-y","-loop","1","-i",src,"-t",f"{d:.3f}",
                  "-vf",vf,"-an","-c:v","libx264","-preset","veryfast","-crf","22",
                  "-pix_fmt","yuv420p","-r","30",dst
              ],check=True)
              segments.append(dst)
          with open("work/concat.txt","w",encoding="utf-8") as f:
              for s in segments:
                  f.write("file '"+os.path.abspath(s).replace("'","'\\''")+"'\n")
          PY
          ffmpeg -y -f concat -safe 0 -i work/concat.txt -c copy work/visuals.mp4

      - name: Assemble narration and captions
        run: |
          VISUAL_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 work/visuals.mp4)"
          export VISUAL_DURATION
          echo "VISUAL_DURATION=$VISUAL_DURATION" >> "$GITHUB_ENV"
          FADE_START="$(python3 -c "print(max(0.0, float('$VISUAL_DURATION') - 1.2))")"
          python3 - <<'PY'
          import os
          a=float(os.environ["AUDIO_DURATION"])
          v=float(os.environ["VISUAL_DURATION"])
          if v < a+0.25:
              raise SystemExit(f"Visual timeline ({v:.2f}s) is shorter than narration ({a:.2f}s)")
          PY
          ffmpeg -y -i work/visuals.mp4 -i work/narration.mp3 \
            -filter_complex "[0:v]subtitles=work/captions.ass,fade=t=out:st=${FADE_START}:d=1.2[v];[1:a]apad,atrim=duration=${VISUAL_DURATION}[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k -movflags +faststart -t "${VISUAL_DURATION}" \
            "work/$SAFE_NAME.mp4"

      - name: Quality control
        run: |
          VIDEO="work/$SAFE_NAME.mp4"
          test -s "$VIDEO"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"
          python3 - <<PY
          d=float("$DURATION")
          if not 45 <= d <= 100:
              raise SystemExit(f"QC failed: duration {d:.2f}s")
          print(f"QC passed: {d:.2f}s")
          PY

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}
          path: work/${{ env.SAFE_NAME }}.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Save render and episode metadata
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p "kids/jori-flimm/state/episodes"
          python3 - <<'PY'
          import json, os

          with open("work/payload.json", encoding="utf-8") as f:
              payload=json.load(f)
          ledger_path="kids/jori-flimm/state/episode-ledger.json"
          state_path="kids/jori-flimm/state/series-state.json"
          with open(ledger_path, encoding="utf-8") as f:
              ledger=json.load(f)
          with open(state_path, encoding="utf-8") as f:
              state=json.load(f)

          number=int(payload["episode_number"])
          episodes=[e for e in ledger.get("episodes",[]) if int(e["episode_number"]) != number]
          record={
              "episode_number":number,
              "date":payload["date"],
              "title":payload["title"],
              "hook":payload["hook"],
              "riddle":payload["riddle"],
              "continuity_note":payload.get("continuity_note",""),
              "visual_assets":[s["image_url"] for s in payload["scenes"]]
          }
          episodes.append(record)
          ledger["episodes"]=episodes[-50:]
          state["last_successful_episode"]=number
          state["next_episode_number"]=number+1
          continuity=state.setdefault("continuity",{})
          after=payload.get("continuity_after",{})
          if "relationship_stage" in after:
              continuity["relationship_stage"]=after["relationship_stage"]
          if "known_facts" in after:
              facts=continuity.setdefault("known_facts",[])
              for fact in after["known_facts"]:
                  if fact not in facts:
                      facts.append(fact)
              continuity["known_facts"]=facts[-100:]
          if "active_threads" in after:
              continuity["active_threads"]=after["active_threads"]
          continuity["recently_used_locations"]=payload.get("locations",continuity.get("recently_used_locations",[]))
          visual_assets=continuity.get("recently_used_visual_assets",[])
          continuity["recently_used_visual_assets"]=(visual_assets+record["visual_assets"])[-50:]
          os.makedirs(os.path.dirname(ledger_path),exist_ok=True)
          with open(ledger_path,"w",encoding="utf-8") as f:
              json.dump(ledger,f,ensure_ascii=False,indent=2)
              f.write("\n")
          with open(state_path,"w",encoding="utf-8") as f:
              json.dump(state,f,ensure_ascii=False,indent=2)
              f.write("\n")
          os.makedirs("kids/jori-flimm/state/episodes",exist_ok=True)
          safe_name=os.environ["SAFE_NAME"]
          with open(f"kids/jori-flimm/state/episodes/{safe_name}.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "kids/jori-flimm/state/episodes/$SAFE_NAME.json" kids/jori-flimm/state/series-state.json kids/jori-flimm/state/episode-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Render $SAFE_NAME"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi
