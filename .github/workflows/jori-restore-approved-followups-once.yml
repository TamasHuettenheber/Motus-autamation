name: Jori – restore verified Buffer media after superseded run
on:
  push:
    branches:
      - feature/jori-flimm-neustart-folge001
    paths:
      - .github/workflows/jori-restore-approved-followups-once.yml
permissions:
  contents: write
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jori-flimm-neustart-folge001
          sparse-checkout: |
            kids/jori-flimm/relaunch-v2
            .github/workflows/jori-restore-approved-followups-once.yml
      - name: Restore exact MP4s from successful Buffer-confirmed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p work/approved published
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/12414976364/zip" -o work/approved.zip
          unzip -o work/approved.zip -d work/approved
          for ep in 2 3 4 5; do
            date=$((22+ep-1))
            file=$(printf "jori-flimm-2026-10-%02d-e%03d.mp4" "$date" "$ep")
            test -s "work/approved/$file"
            cp "work/approved/$file" "published/$file"
            echo "RESTORED_CONFIRMED_RENDER $file $(stat -c %s "published/$file")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse published/jori-flimm-2026-10-2*-e00*.mp4
          if ! git diff --cached --quiet; then
            git commit -m "kids: restore exactly Buffer-confirmed episode 002–005 media"
            git pull --rebase origin feature/jori-flimm-neustart-folge001
            git push origin HEAD:feature/jori-flimm-neustart-folge001
          fi
          echo "JORI_VERIFIED_MEDIA_RESTORED_AND_BUFFER_URLS_UNCHANGED"
