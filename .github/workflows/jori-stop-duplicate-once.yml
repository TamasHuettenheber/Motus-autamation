name: Jori – stop superseded duplicate production
on:
  push:
    branches:
      - feature/jori-flimm-neustart-folge001
    paths:
      - .github/workflows/jori-stop-duplicate-once.yml
permissions:
  actions: write
  contents: read
jobs:
  stop-old-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete episode 002–005 rerun only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=39752979066
          status=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$run_id" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
          if [ "$status" = completed ]; then
            echo "Old duplicate run already completed; no cancellation needed"
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel"
          echo "Cancelled superseded Jori production run $run_id"
