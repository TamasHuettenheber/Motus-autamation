name: Motus Daily Batch
run-name: Daily Motus ${{ github.event.issue.title || inputs.issue_number }}

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing [MOTUS-DAY] issue number to process"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  dispatch:
    if: >
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[MOTUS-DAY]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate batch and dispatch missing renderers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          issue_number = (os.environ.get("EVENT_ISSUE_NUMBER") or os.environ.get("DISPATCH_ISSUE_NUMBER") or "").strip()
          if not issue_number:
              raise SystemExit("Missing batch issue number")

          api_base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "motus-daily-batch",
          }

          def gh(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api_base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8","replace")
                  raise RuntimeError(f"GitHub {method} {path} -> HTTP {exc.code}: {body[:1500]}")

          issue = gh("GET", f"/issues/{issue_number}")
          if not str(issue.get("title","")).startswith("[MOTUS-DAY]"):
              raise SystemExit(f"Issue #{issue_number} is not a [MOTUS-DAY] batch")

          try:
              batch = json.loads(issue.get("body") or "")
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Batch body must be pure JSON: {exc}")

          date = str(batch.get("date","")).strip()
          slots = batch.get("slots")
          dry_run = bool(batch.get("dry_run", False))
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", date):
              raise SystemExit("Invalid or missing date")
          if not isinstance(slots, list) or len(slots) != 4:
              raise SystemExit("Exactly four slots are required")

          normalized = []
          seen = set()
          for n, slot in enumerate(slots, 1):
              if not isinstance(slot, dict):
                  raise SystemExit(f"Slot {n} must be an object")
              hm = str(slot.get("time","")).replace(":","").strip()
              audio = str(slot.get("audio_url","")).strip()
              text = str(slot.get("text","")).strip()
              broll = str(slot.get("broll_url","")).strip()
              if not re.fullmatch(r"\d{4}", hm):
                  raise SystemExit(f"Slot {n}: invalid time")
              hh, mm = int(hm[:2]), int(hm[2:])
              if hh > 23 or mm > 59 or hm in seen:
                  raise SystemExit(f"Slot {n}: invalid/duplicate time {hm}")
              seen.add(hm)
              if not audio.startswith("https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/") or not audio.endswith(".mp3"):
                  raise SystemExit(f"Slot {hm}: AUDIO_URL must be a direct AI Voice Generator preview MP3")
              if not text:
                  raise SystemExit(f"Slot {hm}: text is missing")
              normalized.append({
                  "time": hm,
                  "audio_url": audio,
                  "text": text,
                  "broll_url": broll,
                  "output_name": f"motus-{date}-{hm}",
              })

          def comment(body):
              gh("POST", f"/issues/{issue_number}/comments", {"body": body})

          if dry_run:
              comment(
                  "MOTUS_DAY_DRY_RUN_OK\n\n"
                  + f"Date: {date}\n"
                  + "Slots: " + ", ".join(x["time"] for x in normalized)
                  + "\nJSON schema and four-slot validation passed. No renderer was started."
              )
              gh("PATCH", f"/issues/{issue_number}", {"state":"closed","state_reason":"completed"})
              print("MOTUS_DAY_DRY_RUN_OK")
              raise SystemExit(0)

          # Idempotency: if the batch workflow is re-opened or re-run, only dispatch
          # renderer slots for which no workflow_dispatch run exists yet.
          runs = gh("GET", "/actions/workflows/motus.yml/runs?event=workflow_dispatch&per_page=100").get("workflow_runs", [])
          existing_titles = {str(r.get("display_title","")) for r in runs}
          dispatched = []
          reused = []

          for slot in normalized:
              title = f"Motus {slot['output_name']}"
              if title in existing_titles:
                  reused.append(slot["output_name"])
                  print("REUSE_EXISTING_RUN:", slot["output_name"])
                  continue
              gh(
                  "POST",
                  "/actions/workflows/motus.yml/dispatches",
                  {
                      "ref": "main",
                      "inputs": {
                          "audio_url": slot["audio_url"],
                          "text": slot["text"],
                          "broll_url": slot["broll_url"],
                          "output_name": slot["output_name"],
                      },
                  },
              )
              dispatched.append(slot["output_name"])
              print("DISPATCHED:", slot["output_name"])

          body = (
              "MOTUS_DAY_DISPATCHED\n\n"
              + f"Date: {date}\n"
              + "Slots: " + ", ".join(x["time"] for x in normalized)
              + "\nNew renderer dispatches: " + (", ".join(dispatched) if dispatched else "none")
              + "\nExisting renderer runs reused: " + (", ".join(reused) if reused else "none")
              + "\n\nGitHub now owns rendering, retries and final Buffer verification. The parent issue remains open until MOTUS_DAY_COMPLETE."
          )
          comment(body)
          print("MOTUS_DAY_HANDOFF_COMPLETE")
          PY
