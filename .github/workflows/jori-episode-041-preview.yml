name: Jori & Flimm — Folge 041 production preview

on:
  push:
    branches: [feature/jori-flimm-neustart-folge001]
    paths:
      - .github/workflows/jori-episode-041-preview.yml
      - kids/jori-flimm/relaunch-v2/episode_041_story_draft.json
      - kids/jori-flimm/relaunch-v2/assets/episode-041-v1/**
      - kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer_e041.py
      - kids/jori-flimm/relaunch-v2/scripts/github_followup_voice_e041.py
      - kids/jori-flimm/relaunch-v2/scripts/generate_voice_gemini_e041.py

permissions:
  contents: write
  actions: read

concurrency:
  group: jori-episode-041-preview
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jori-flimm-neustart-folge001
          fetch-depth: 1
          sparse-checkout: |
            kids/jori-flimm
            published
            .github/workflows/jori-episode-041-preview.yml
      - name: Install isolated static FFmpeg tools and Pillow
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-tools" "$RUNNER_TEMP/bin"
          npm --silent install --prefix "$RUNNER_TEMP/ffmpeg-tools" ffmpeg-static@5.2.0 ffprobe-static@3.1.0
          ln -sf "$(node -p "require('$RUNNER_TEMP/ffmpeg-tools/node_modules/ffmpeg-static')")" "$RUNNER_TEMP/bin/ffmpeg"
          ln -sf "$(node -p "require('$RUNNER_TEMP/ffmpeg-tools/node_modules/ffprobe-static').path")" "$RUNNER_TEMP/bin/ffprobe"
          chmod +x "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ffmpeg" -version | head -1
          "$RUNNER_TEMP/bin/ffprobe" -version | head -1
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python3 -c 'import PIL' || python3 -m pip install --user --disable-pip-version-check Pillow
          python3 -c 'from PIL import Image,ImageDraw,ImageFont; print("LOCAL_RENDER_TOOLS_READY", Image.__version__)'
      - name: Validate story, seven new images, safe zone and Python before TTS
        run: |
          set -euo pipefail
          python3 -m py_compile \
            kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer_e041.py \
            kids/jori-flimm/relaunch-v2/scripts/github_followup_voice_e041.py \
            kids/jori-flimm/relaunch-v2/scripts/generate_voice_gemini_e041.py
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          from PIL import Image
          base=Path('kids/jori-flimm/relaunch-v2')
          e=json.loads((base/'episode_041_story_draft.json').read_text(encoding='utf-8'))
          prev=json.loads((base/'episode_040_story_draft.json').read_text(encoding='utf-8'))
          assert e['episode_number']==41 and e['title']=='Das fehlende Mondstück'
          assert prev['episode_number']==40 and 'Mondbrunnen' in prev['cliff'] and 'vierter, kräftiger Schlag' in prev['cliff']
          assert e['previous_cliffhanger']==prev['cliff']
          assert e['hook'].startswith('Der vierte, kräftige Schlag ließ den Deckel des Mondbrunnens beben.')
          assert e['riddle']['type']=='shape_completion_missing_lower_left_curve' and e['riddle']['pause_seconds']==7
          assert e['question']==e['riddle']['question'] and e['answer']=='Teil B!'
          assert e['clues']==['Lücke: unten links gebogen','A: oben rechts gebogen','B: unten links gebogen','C: Sternform'] and e['correct']==1
          assert e['narration'].count('[[PAUSE:7]]')==1 and e['narration'].count('[[SEGMENT]]')==2
          assert not re.search(r'\bJori\b[^.!?]{0,75}\b(?:er|ihn|ihm)\b',e['narration'],re.I)
          clean=lambda s:re.sub(r'\[\[(?:PAUSE:[0-9.]+|SEGMENT)\]\]',' ',s)
          words=lambda s:re.findall(r'\w+',s.lower())
          assert words(clean(e['narration_tts']))==words(clean(e['narration']))
          assert e['voice']=={'provider':'Gemini TTS 3.8','model':'gemini-3.8-flash-lite-tts','speaker_id':'Sulafat'}
          paths=[Path(v['path']) for v in e['visuals']]
          assert len(paths)==7 and len(set(paths))==7
          hashes=[]
          for p in paths:
              assert p.is_file(),p
              with Image.open(p) as im:
                  w,h=im.size;assert h>w and abs(w/h-9/16)<.01 and w>=720 and h>=1280,(p,im.size)
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          assert len(set(hashes))==7
          old={hashlib.sha256(p.read_bytes()).hexdigest() for d in (base/'assets').glob('episode-*-v*') if d.name!='episode-041-v1' for p in d.glob('scene-*')}
          assert not (set(hashes)&old),'episode 041 reused an earlier scene image'
          renderer=(base/'scripts/github_followup_renderer_e041.py').read_text()
          assert "(60,132,540,820)" in renderer and "MarginL,MarginR" in renderer and "2,60,180,277" in renderer
          # Concrete evidence from yesterday's successful production: same secret/model,
          # Free Tier confirmed and no billing-mode change. The TTS script enforces 22 s spacing and at most four requests.
          status=(base.parent/'docs/production-status-2026-11-26-e040.md').read_text(encoding='utf-8')
          assert 'gemini-3.8-flash-lite-tts' in status and 'Free-Tier-Anfragen' in status
          assert 'kein Paid-Fallback' in status
          print('JORI_E041_STORY_ART_SAFEZONE_QC_OK',json.dumps({'title':e['title'],'seven_unique_new_9x16_scenes':True,'continuity':e['continuity'],'safe_text_x':'60..540'},ensure_ascii=False))
          PY
      - name: Generate Sulafat using the verified Free Tier model
        env:
          JORI_GEMINI_API_KEY: ${{ secrets.JORI_GEMINI_API_KEY }}
          JORI_TTS_MODEL: gemini-3.8-flash-lite-tts
        run: python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_voice_e041.py
      - name: Persist successful Sulafat chunks and timeline for safe retries
        if: always()
        run: |
          set -euo pipefail
          cache_dir='kids/jori-flimm/relaunch-v2/audio-cache/episode-041'
          if [ -d "$cache_dir" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --sparse "$cache_dir"
            if ! git diff --cached --quiet; then
              git commit -m 'kids: cache Sulafat audio for Jori episode 041'
              git pull --rebase origin feature/jori-flimm-neustart-folge001
              git push origin HEAD:feature/jori-flimm-neustart-folge001
            fi
          fi
      - name: Render and QC the actual MP4
        run: |
          set -euo pipefail
          python3 kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer_e041.py --episode 41
          python3 - <<'PY'
          import json,re,subprocess,wave
          from pathlib import Path
          base=Path('work/episode_041');t=json.loads((base/'voice-timeline.json').read_text());items=t['items']
          assert [x['kind'] for x in items]==['speech','speech','speech','pause','speech']
          pause=items[3];assert abs(pause['duration']-7)<.001
          with wave.open(str(base/'narration_source.wav'),'rb') as w:
              assert (w.getframerate(),w.getsampwidth(),w.getnchannels())==(24000,2,1)
              w.setpos(round(pause['start']*24000));silence=w.readframes(7*24000)
              assert len(silence)==7*24000*2 and not any(silence)
          captions=(base/'captions.ass').read_text()
          def sec(s):h,m,x=s.split(':');return int(h)*3600+int(m)*60+float(x)
          rows=[x for x in captions.splitlines() if x.startswith('Dialogue:')]
          for row in rows:
              cols=row.split(',',9);a,b=sec(cols[1]),sec(cols[2]);assert b<=pause['start']+.01 or a>=pause['end']-.01,row
          expected=re.findall(r'\w+',' '.join(x['text'] for x in items if x['kind']=='speech').lower())
          visible=re.findall(r'\w+',' '.join(x.split(',',9)[-1].replace('\\N',' ') for x in rows).lower());assert visible==expected
          media=Path('published/jori-flimm-2026-12-01-e041-v1.mp4')
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_type,codec_name,width,height','-show_entries','format=duration,size','-of','json',str(media)],text=True))
          streams=probe['streams'];assert len(streams)==2
          v=next(x for x in streams if x['codec_type']=='video');a=next(x for x in streams if x['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'])==('h264',720,1280) and a['codec_name']=='aac'
          duration=float(probe['format']['duration']);assert 70<duration<180 and abs(duration-float(t['duration']))<.25 and int(probe['format']['size'])>1_000_000
          p=subprocess.run(['ffmpeg','-hide_banner','-i',str(media),'-af','silencedetect=noise=-60dB:d=6.5','-f','null','-'],capture_output=True,text=True,check=True)
          measured=[float(x) for x in re.findall(r'silence_duration:\s*([0-9.]+)',p.stderr)];assert any(abs(x-7)<=.2 for x in measured),measured
          st=json.loads((base/'scene-timing.json').read_text());assert [x['scene'] for x in st]==['hook','story_a','story_b','story_c','puzzle','answer','cliff_transition','cliff']
          assert abs(st[4]['end']-pause['end'])<.01
          print('JORI_E041_MP4_QC_OK',json.dumps({'duration':duration,'bytes':probe['format']['size'],'video':'720x1280 H.264','audio':'AAC Sulafat','measured_pause_seconds':measured,'caption_token_match':True,'tiktok_safe_zone':True},ensure_ascii=False))
          PY
      - name: Save actual preview and QC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jori-Episode-041-Preview
          path: |
            published/jori-flimm-2026-12-01-e041-v1.mp4
            work/episode_041/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit only the validated preview MP4
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse published/jori-flimm-2026-12-01-e041-v1.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'kids: add validated Jori episode 041 preview'
            git pull --rebase origin feature/jori-flimm-neustart-folge001
            git push origin HEAD:feature/jori-flimm-neustart-folge001
          fi

# Start E041 production on 2026-11-27 after live Buffer absence check run 45956418354.





