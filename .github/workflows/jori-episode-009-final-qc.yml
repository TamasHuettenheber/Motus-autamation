name: Jori & Flimm — Folge 009 final MP4 QC

on:
  push:
    branches:
      - feature/jori-flimm-neustart-folge001
    paths:
      - .github/workflows/jori-episode-009-final-qc.yml
      - published/jori-flimm-2026-10-30-e009-v2.mp4
      - kids/jori-flimm/relaunch-v2/episode_009_story_draft.json
      - kids/jori-flimm/relaunch-v2/assets/episode-009-v1/**
      - kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer_e009.py

permissions:
  contents: read

jobs:
  final-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jori-flimm-neustart-folge001
          fetch-depth: 1
          sparse-checkout: |
            kids/jori-flimm/relaunch-v2
            published/jori-flimm-2026-10-30-e009-v2.mp4
      - name: Install QC tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
      - name: Validate story, art and actual MP4
        run: |
          set -euo pipefail
          python3 -m py_compile kids/jori-flimm/relaunch-v2/scripts/github_followup_renderer_e009.py
          python3 - <<'PY'
          import hashlib,json,re,subprocess,tempfile
          from pathlib import Path
          from PIL import Image,ImageStat
          base=Path('kids/jori-flimm/relaunch-v2')
          e=json.loads((base/'episode_009_story_draft.json').read_text(encoding='utf-8'))
          assert e['episode_number']==9 and e['title']=='Das Sternbild ohne Anfang'
          assert e['voice']=={'provider':'Gemini TTS 3.8','model':'gemini-3.8-flash-lite-tts','speaker_id':'Sulafat'}
          assert e['narration'].count('[[PAUSE:7]]')==1
          assert not re.search(r'\bJori\b.{0,70}\b(?:er|ihn|sein|ihm)\b',e['narration'],re.I)
          paths=[Path(v['path']) for v in e['visuals']]
          assert len(paths)==6 and len(set(paths))==6
          hashes=[]
          for p in paths:
              assert p.is_file(),p
              with Image.open(p) as im:
                  assert abs(im.width/im.height-9/16)<=0.002,(p,im.size)
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          assert len(set(hashes))==6
          media=Path('published/jori-flimm-2026-10-30-e009-v2.mp4')
          assert media.is_file() and media.stat().st_size>1_000_000
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_type,codec_name,width,height,duration','-show_entries','format=duration,size','-of','json',str(media)],text=True))
          streams=probe['streams'];assert len(streams)==2,streams
          v=next(x for x in streams if x['codec_type']=='video');a=next(x for x in streams if x['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'])==('h264',720,1280),v
          assert a['codec_name']=='aac',a
          assert abs(float(probe['format']['duration'])-94.125)<0.10,probe['format']
          proc=subprocess.run(['ffmpeg','-hide_banner','-i',str(media),'-af','silencedetect=noise=-60dB:d=6.5','-f','null','-'],capture_output=True,text=True,check=True)
          measured=[float(x) for x in re.findall(r'silence_duration:\s*([0-9.]+)',proc.stderr)]
          assert any(abs(x-7.0)<=0.2 for x in measured),measured
          # Sample the answer/progress scene after the pause. The large dark answer bar
          # formerly covered y=420..500 for the full segment; v2 must contain no such bar.
          with tempfile.TemporaryDirectory() as td:
              frame=Path(td)/'answer-progress.png'
              subprocess.run(['ffmpeg','-nostdin','-v','error','-ss','65','-i',str(media),'-frames:v','1',str(frame)],check=True)
              im=Image.open(frame).convert('RGB')
              crop=im.crop((76,420,644,500))
              means=ImageStat.Stat(crop).mean
              assert sum(means)>210,means
          renderer=(base/'scripts/github_followup_renderer_e009.py').read_text(encoding='utf-8')
          assert 'DER STERNENKREIS!' not in renderer
          print('JORI_E009_FINAL_QC_OK',json.dumps({
              'path':str(media),'duration':probe['format']['duration'],
              'bytes':probe['format']['size'],'video':'720x1280 H.264',
              'audio':'AAC Sulafat','six_unique_images':True,
              'measured_pause_seconds':measured,
              'answer_overlay_removed':True,
              'manual_visual_samples_seconds':[2,10,16,30,42,48.5,54.5,55.5,65,79,88,93]
          },ensure_ascii=False))
          PY
