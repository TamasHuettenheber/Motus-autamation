name: MOTUS Night Production
on:
  schedule:
    - cron: '37 20 * * *'
    - cron: '37 21 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: motus-night-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Generate next MOTUS day and dispatch exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_KEY: ${{ secrets.JORI_GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 -u - <<'PY'
          import json,os,urllib.request,urllib.error
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Berlin"))
          if os.environ["EVENT"]=="schedule" and not ((now.hour==22 and now.minute>=37) or now.hour==23 or 0<=now.hour<7):
              print("OUTSIDE_NIGHT_WINDOW",now.isoformat());raise SystemExit(0)
          target=(now.date()+timedelta(days=2 if now.hour>=22 else 1)).isoformat()
          target_weekday=("Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag")[datetime.fromisoformat(target).weekday()]
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","User-Agent":"motus-night-producer"}
          def gh(method,path,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode()
              url=("https://api.github.com"+path if path.startswith("/search/") else "https://api.github.com/repos/"+repo+path)
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=50) as response:
                  raw=response.read();return json.loads(raw) if raw else {}
          title="[MOTUS-DAY] "+target
          # Query the exact issue title server-side; avoid the 500-item listing limit.
          from urllib.parse import quote
          issues=[]
          query=quote(f'repo:{repo} is:issue in:title "{target}"',safe="")
          found=gh("GET",f"/search/issues?q={query}&per_page=100").get("items",[])
          issues=[i for i in found if not i.get("pull_request") and i.get("title")==title]
          existing=next(iter(issues),None)
          if existing:
              print("ALREADY_EXISTS",existing["number"],existing["state"])
              if existing["state"]=="open":
                  notes=gh("GET",f"/issues/{existing['number']}/comments?per_page=100")
                  complete=any(str(c.get("body","")).startswith("MOTUS_DAY_COMPLETE") for c in notes)
                  print("DAY_COMPLETION_VERIFIED",complete,"ISSUE",existing["number"])
                  if not complete:
                      # Recover a lost initial handoff: status workflow repairs missing renderer slots,
                      # while the day workflow validates and dispatches the batch idempotently.
                      runs=[]
                      for page in range(1,6):
                          chunk=gh("GET",f"/actions/workflows/motus-day.yml/runs?per_page=100&page={page}").get("workflow_runs",[])
                          runs.extend(chunk)
                          if len(chunk)<100:break
                      title_match=f"Daily Motus {existing['number']}"
                      matched=sorted((run for run in runs if str(run.get("display_title",""))==title_match),key=lambda run:run.get("created_at",""),reverse=True)
                      if not matched or (matched[0].get("status")=="completed" and matched[0].get("conclusion")!="success"):
                          gh("POST","/actions/workflows/motus-day.yml/dispatches",{"ref":"main","inputs":{"issue_number":str(existing["number"])}})
                          print("RECOVERED_MISSING_OR_FAILED_DAY_HANDOFF",existing["number"])
                      else:
                          print("RECONCILIATION_ACTIVE_EVERY_15_MINUTES_IN_MOTUS_DAY_STATUS")
              raise SystemExit(0)
          key=os.environ.get("GEMINI_KEY","")
          if not key:raise SystemExit("GEMINI_KEY_MISSING")
          # Load the 14-day editorial plan from the checked-in repository content via GitHub API.
          # No new external AI calls and no mutation of already existing day issues.
          import base64
          editorial_file=gh("GET","/contents/config/motus-editorial-cards.json")
          editorial=json.loads(base64.b64decode(editorial_file["content"]).decode("utf-8"))["slots"]
          editorial_index=datetime.fromisoformat(target).date().toordinal()%14
          times_editorial=["07:00","12:00","18:30","22:00"]
          if any(len(editorial.get(t,[]))!=14 for t in times_editorial):
              raise SystemExit("EDITORIAL_CONFIG_INVALID")
          editorial_today={t:editorial[t][editorial_index] for t in times_editorial}
          if len({editorial_today[t]["topic"] for t in times_editorial})!=4:
              raise SystemExit("EDITORIAL_SAME_DAY_DUPLICATE")
          print("EDITORIAL_PLAN",target,[(t,editorial_today[t]["topic"]) for t in times_editorial])
          # Controlled length A/B test for NEW days only; existing issues and videos stay untouched.
          # Rotate slot assignments daily to avoid confounding length with publication time.
          short_times=({"07:00","18:30"} if datetime.fromisoformat(target).date().toordinal()%2==0 else {"12:00","22:00"})
          long_times={"07:00","12:00","18:30","22:00"}-short_times
          print("LENGTH_AB_PLAN",target,"SHORT",sorted(short_times),"LONG",sorted(long_times))
          prompt=("Erstelle vier originelle, voneinander klar verschiedene deutsche MOTUS-Kurztexte "
                  "fuer einen Tagesplan mit den Slots 07:00,12:00,18:30,22:00. "
                  +f"Die Slots {', '.join(sorted(short_times))} sind KURZ mit jeweils 35 bis 45 Woertern; "
                  +f"die Slots {', '.join(sorted(long_times))} sind LANG mit jeweils 65 bis 75 Woertern. "
                  +"Halte die Wortzahl pro Slot strikt ein; KURZ maximal 55, LANG maximal 85 Woerter. "
                  "Bei KURZ sofort Konflikt und Loesung, kein langes Intro. Beide Gruppen muessen "
                  "gleich starke Hooks, eine konkrete alltagstaugliche Handlung und eine natuerliche CTA haben. "
                  "Beginne JEDEN Text sofort mit einem anderen konkreten Hook: einer beobachtbaren "
                  "Alltagssituation, einer spannenden Frage oder einem nachvollziehbaren Konflikt. "
                  "Die ersten zwei Sekunden duerfen keine allgemeinen Floskeln ueber Energie, "
                  "Fokus, Motivation oder den Tagesbeginn enthalten. "
                  "Baue in jeden Text eine anschauliche, realistische Alltagsszene ein. "
                  +f"Der Zieltag ist {target_weekday}, {target}; beachte dies bei der Szenenwahl. "
                  +"Am Sonntag keine regulaere Briefzustellung, normale Supermarktoeffnung "
                  "oder andere nur werktags uebliche Ablaeufe voraussetzen. "
                  "Ist der Zieltag ein Sonntag, verwende niemals eine Szene innerhalb "
                  "eines Supermarkts, Lebensmittelgeschaefts oder Einkaufszentrums; "
                  "auch leere Einkaufsregale sind dann kein plausibler Schauplatz. "
                  "Wochentag und Datum niemals im Beitrag selbst nennen. "
                  "Alle Empfehlungen muessen sicher und praktisch umsetzbar sein. "
                  "Jeder Tipp braucht einen nachvollziehbaren Zusatznutzen statt bloss eine "
                  "Selbstverstaendlichkeit wie Ersatzvorrat holen oder Kartons falten zu beschreiben. "
                  "Keine ungeprueften Hausmittel- oder Reinigungstricks fuer unbekannte Materialien "
                  "empfehlen; Materialvertraeglichkeit und sichere Anwendung beachten. "
                  "Rate niemals dazu, verschuettete heisse Fluessigkeiten, rutschige "
                  "Verschmutzungen oder andere unmittelbare Gefahren liegen zu lassen. "
                  "Nutze keine Szenen mit anbrennendem Essen, eingeschalteten Herden, "
                  "Rauch, verschuetteten heissen Fluessigkeiten oder sonstigen akuten Gefahren "
                  "als Aufhaenger; waehle stattdessen ungefaehrliche Alltagssituationen. "
                  "Wenn auf einem eingeschalteten Herd Essen anbrennt, muss zuerst der Herd "
                  "sicher ausgeschaltet werden; rate dabei nie zum Augenschliessen, "
                  "Abwarten oder gedanklichen Wegschieben akuter Gefahren. "
                  "Vermeide austauschbare Phrasen, Kunstwoerter und unnatuerliche Formulierungen. "
                  "Pruefe vor der JSON-Ausgabe jeden Text auf korrekte deutsche Rechtschreibung und Grammatik. "
                  "Verwende ä, ö, ü und ß nach deutschen Rechtschreibregeln; "
                  "schreibe ss, wo es korrekt ist, und vermeide ae/oe/ue-Umschriften; "
                  "keine Tippfehler, Fantasiewoerter oder falschen Wortzusammensetzungen. "
                  "Morgens geht es um eine konkrete Gewohnheit oder Entscheidung, mittags um ein "
                  "praktisches Hindernis, abends um einen sozialen Moment, eine Freude oder eine "
                  "konkrete Alltagssituation statt staendig Grenzen zu setzen, nachts um "
                  "Erholung, Reflexion oder innere Ruhe statt staendig zu gruebeln. "
                  "Die vier Themen muessen sich unterscheiden. "
                  "Vermeide wiederkehrende Standardmotive wie Handy direkt nach dem Aufwachen, "
                  "Kantinenstress, Diensthandy am Feierabend und Grübeln im Bett; wähle stattdessen "
                  "andere konkrete, glaubwürdige Alltagssituationen und Konflikte. "
                  "Keine erneuten Nachbar-Paketannahme-Szenen und keine Notizblock-am-Bett-Szenen; "
                  "diese Motive wurden zuletzt mehrfach verwendet. Vermeide auch morgendliche "
                  "Kaffeetassen-Hooks, mittags Kollegenunterbrechungen und Druckerstaus, "
                  "abends Nachbarinnen, spontane Besuchsabsagen und immer gleiche Nein-sagen-Szenen "
                  "sowie nachts Kleiderhaufen, Schatten und Schlafzimmer-Unordnung. "
                  "Waehle wirklich andere Konflikte und Handlungen statt blosser Kulissenwechsel. "
                  "Vermeide die zuletzt an Folgetagen wiederholten Kernhandlungen: morgens "
                  "Sportvorsatz mit Wecker oder Treppe, mittags Unterbrechungen durch Kollegen, "
                  "abends spontane Besuchsbitten ablehnen, nachts morgige Termine mit Notizzettel lösen. "
                  "Neue Schauplätze zählen nicht als neue Ideen; wähle jeweils eine andere Handlung. "
                  "JEDER der vier Texte braucht eine eindeutige, natuerlich eingebettete "
                  "Handlungsaufforderung an Zuschauer: Kommentarfrage, Speichern, Teilen oder Folgen. "
                  "Variiere die CTA-Art ueber alle vier Slots; keine blossen Selbstanweisungen. "
                  "Keine mechanisch angehaengte Standard-CTA und keine privaten Daten erfragen. "
                  "Direkte Du-Ansprache, idiomatisches korrektes Deutsch ausschliesslich in "
                  "lateinischer Schrift, keine fremdsprachigen Einschuebe, kein Clickbait. "
                  "Erwaehne keine Wochentage, Datumsangaben, Uhrzeiten, konkretes Wetter oder "
                  "kalendarische Behauptungen. Antworte ausschliesslich als JSON mit Schluessel "
                  "slots, Array von vier Objekten mit time und text.")
          # Explicit positive editorial direction, not merely a growing list of forbidden topics.
          # Keep the AI output fresh but anchored in 56 distinct MOTUS psychology/motivation concepts.
          briefs=" ".join(
              f"{t}: THEMA '{editorial_today[t]['topic']}'. "
              f"Aufhaenger: {editorial_today[t]['hook']} "
              f"Konkrete psychologische Handlung: {editorial_today[t]['action']}"
              for t in times_editorial
          )
          prompt += (" VERBINDLICHER REDAKTIONSPLAN: "+briefs+
                     " Jeder Slot MUSS genau seinen zugeordneten psychologischen Kernkonflikt "
                     "und die dazu passende bewusste Entscheidung behandeln, in natuerlichem Deutsch. "
                     "MOTUS ist ein Kanal fuer Mut, Selbstvertrauen, Haltung, Beziehungen, Reflexion "
                     "und persoenliche Entwicklung, NICHT fuer Haushalt, Putzen, Aufraeumen, "
                     "Vorratshaltung, Gartentipps oder banale Alltagsorganisation. "
                     "Ein Aufhaenger darf alltaeglich sein, aber der Mehrwert muss eine "
                     "psychologische Einsicht und eine konkrete selbstbestimmte Handlung sein. "
                     "Keine beliebigen anderen Themen statt der vier verbindlichen Konzepte.")
          payload={"contents":[{"parts":[{"text":prompt}]}],"generationConfig":{"responseMimeType":"application/json","temperature":0.9}}
          import time
          models=["gemini-3.5-flash-lite","gemini-3.8-flash"]
          generated=None
          last_error="no model attempted"
          for model in models:
              for attempt in range(3):
                  req=urllib.request.Request(
                      f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type":"application/json","x-goog-api-key":key},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=65) as response:
                          generated=json.load(response)
                      print("GEMINI_GENERATED",model)
                      break
                  except urllib.error.HTTPError as exc:
                      body=exc.read().decode("utf-8","replace")
                      try:
                          detail=json.loads(body).get("error",{}).get("message","")
                      except (json.JSONDecodeError,AttributeError,TypeError):
                          detail=body[:500]
                      last_error=f"{model} HTTP {exc.code}"
                      print("GEMINI_HTTP_ERROR",model,exc.code,str(detail)[:400])
                      if exc.code in (408,429,500,502,503,504) and attempt<2:
                          delay=15*(attempt+1)
                          print("GEMINI_RETRY",attempt+1,"HTTP",exc.code,"WAIT_SECONDS",delay)
                          time.sleep(delay)
                          continue
                      break
                  except (urllib.error.URLError,TimeoutError) as exc:
                      last_error=f"{model} {type(exc).__name__}"
                      if attempt<2:
                          delay=15*(attempt+1)
                          print("GEMINI_RETRY",attempt+1,type(exc).__name__,"WAIT_SECONDS",delay)
                          time.sleep(delay)
                          continue
                      print("GEMINI_MODEL_EXHAUSTED",model,last_error)
                      break
              if generated is not None:
                  break
              print("GEMINI_FALLBACK_MODEL",model)
          if generated is None:
              raise SystemExit("GEMINI_ALL_MODELS_FAILED "+last_error)
          raw=generated["candidates"][0]["content"]["parts"][0]["text"]
          parsed=json.loads(raw)
          if isinstance(parsed,dict):
              slots=parsed.get("slots")
          elif isinstance(parsed,list):
              slots=parsed
              print("GEMINI_ROOT_ARRAY_NORMALIZED")
          else:
              raise SystemExit("BAD_GEMINI_ROOT")
          if not isinstance(slots,list) or any(not isinstance(s,dict) for s in slots):
              raise SystemExit("BAD_SLOTS_SCHEMA")
          # Deterministic corrections for verified recurrent Gemini misspellings.
          # Apply only while creating a new day; existing issues/videos stay untouched.
          spelling_fixes={
              "Stioerfaktor":"Störfaktor","nervogen":"nervös",
              "hartnaeckig":"hartnäckig","waehrend":"während",
              "Kuechentisch":"Küchentisch","unaufhoerlich":"unaufhörlich",
              "Geraet":"Gerät","draussen":"draußen",
              "ueber":"über","fuenf":"fünf","ungeloest":"ungelöst",
              "Gespraech":"Gespräch","naemlich":"nämlich",
              "fuer":"für","erschoepft":"erschöpft",
              "schliesst":"schließt","Tuer":"Tür",
              "eetrudeln":"eintrudeln","Energiefoch":"Energielevel",
              "ungelueftet":"ungelüftet","unwillkuerlich":"unwillkürlich"
          }
          for slot in slots:
              original=slot.get("text","")
              corrected=original
              for wrong,right in spelling_fixes.items():
                  corrected=corrected.replace(wrong,right)
              if corrected!=original:
                  print("SPELLING_QC_CORRECTED",slot.get("time",""))
                  slot["text"]=corrected
          if len(slots)!=4:raise SystemExit("BAD_SLOT_COUNT")
          times=["07:00","12:00","18:30","22:00"]
          if [s.get("time") for s in slots]!=times:raise SystemExit("BAD_SLOT_TIMES")
          # Mandatory editorial gate: bad AI text is replaced locally with a curated,
          # psychologically meaningful fallback. No extra model requests or paid services.
          import re
          from urllib.parse import quote
          cta_options=[
              "Was würdest du in dieser Situation tun? Schreib es in die Kommentare.",
              "Speichere diesen Gedanken für deinen nächsten schwierigen Moment.",
              "Teile diesen Impuls mit jemandem, dem er heute helfen könnte.",
              "Folge MOTUS für neue Gedanken über Mut, Klarheit und Selbstvertrauen.",
          ]
          reflections=[
              "Du musst dafür nicht perfekt sein. Wichtig ist, dass deine Entscheidung zu deinen Werten passt und du bewusst handelst.",
              "Die erste Reaktion ist nicht immer die beste. Mit etwas Abstand erkennst du häufig, was wirklich zählt.",
              "Nicht jede Unsicherheit verlangt eine schnelle Antwort. Manchmal ist Nachdenken der mutigere und vernünftigere Weg.",
              "Es geht nicht darum, anderen etwas zu beweisen. Du entscheidest, welche Haltung du selbst vertreten möchtest.",
              "Wer seine Gefühle ernst nimmt, muss ihnen nicht blind folgen. Zwischen Gefühl und Handlung liegt deine Freiheit.",
              "Ein guter nächster Schritt muss nicht spektakulär sein. Er sollte nur ehrlich zu deinem eigentlichen Ziel passen.",
              "Dein Wert hängt nicht davon ab, ob andere sofort zustimmen. Entscheidend ist, wie respektvoll du deinen Weg gehst.",
              "Veränderung braucht keine große Bühne. Oft beginnt sie in einem einzigen Gespräch, das du bewusst anders führst.",
              "Du kannst Verantwortung übernehmen, ohne dich für alles schuldig zu fühlen. Beides ist nicht dasselbe.",
              "Manchmal entsteht Klarheit erst, wenn du eine alte Annahme hinterfragst und offen für neue Erfahrungen bleibst.",
              "Eine ehrliche Entscheidung kann unbequem sein. Trotzdem bringt sie dich näher an das Leben, das du gestalten möchtest.",
              "Nicht jeder Konflikt muss sofort gelöst werden. Wichtig ist, dass du respektvoll und handlungsfähig bleibst.",
              "Selbstvertrauen entsteht durch Erfahrung, nicht durch ständiges Grübeln. Du darfst etwas versuchen und dabei lernen.",
              "Wer genauer hinsieht, entdeckt oft mehr Möglichkeiten als zunächst sichtbar waren. Gib dir dafür einen Moment Zeit.",
          ]
          stopwords={"eine","einer","einen","einem","eines","deine","deinen","deiner","deinem","deines",
                     "dich","dir","dass","dann","heute","morgen","nicht","wenn","weil","aber","oder",
                     "wieder","wirst","wurde","werden","solltest","kannst","soll","noch","schon",
                     "etwas","jemand","jemanden","jemandem","dabei","darum","statt","erst","jetzt",
                     "einem","einer","andere","anderen","andern","wichtig","wirklich","immer",
                     "mehr","ganz","auch","einem","bevor","einen","eine","einer","dein","du","der",
                     "die","das","und","ist","mit","für","auf","von","den","dem","ein","zum","zur"}
          def tokens(value):
              return {w for w in re.findall(r"[a-zäöüß]{4,}",value.lower()) if w not in stopwords}
          def word_count(value):
              return len(value.split())
          def fallback(t):
              card=editorial_today[t]
              slot_index=times_editorial.index(t)
              base=card["hook"]+" "+card["action"]
              cta=cta_options[(editorial_index+slot_index)%len(cta_options)]
              if t in short_times:
                  result=base+" "+cta
                  if word_count(result)<30:
                      result=base+" Entscheide bewusst, statt nur aus Gewohnheit zu reagieren. "+cta
              else:
                  idx=(editorial_index+slot_index*3)%len(reflections)
                  result=base+" "+reflections[idx]+" "+cta
                  if word_count(result)<55:
                      result=base+" "+reflections[idx]+" "+reflections[(idx+7)%len(reflections)]+" "+cta
              return result
          previous_texts=[]
          try:
              q=quote(f'repo:{repo} is:issue in:title "MOTUS-DAY"',safe="")
              old=gh("GET",f"/search/issues?q={q}&per_page=100").get("items",[])
              cutoff=datetime.fromisoformat(target).date()-timedelta(days=14)
              for item in old:
                  old_title=str(item.get("title",""))
                  if not old_title.startswith("[MOTUS-DAY] "):continue
                  try: old_date=datetime.fromisoformat(old_title[-10:]).date()
                  except ValueError:continue
                  if not cutoff<=old_date<datetime.fromisoformat(target).date():continue
                  try: old_slots=json.loads(item.get("body") or "{}").get("slots",[])
                  except (ValueError,TypeError):continue
                  previous_texts.extend(str(x.get("text","")) for x in old_slots if isinstance(x,dict))
          except Exception as exc:
              print("EDITORIAL_HISTORY_UNAVAILABLE",type(exc).__name__)
          old_tokens=[tokens(x) for x in previous_texts]
          viewer_cta=re.compile(r"(?i)\b(?:kommentier\w*|schreib\w*|speicher\w*|teil\w*|folg\w*|abonnier\w*)\b")
          household=re.compile(r"(?i)\b(?:zahnpasta|duschkopf|kartons?|zimmerpflanze|blumengieß\w*|gieß\w*|kalkflecken|putzmittel|ersatzpackung|briefsortier\w*|papiermüll|staubsauger|wäschesortier\w*|spülmaschine|briefkasten)\b")
          safety=re.compile(r"(?i)\b(?:anbrenn\w*|herdplatte\w*|kochend\w*|rutschig\w*|essigreiniger|chlorreiniger|brandgefahr|rauchmelder)\b")
          import unicodedata
          for slot in slots:
              t=slot["time"]; value=str(slot.get("text","")).strip()
              card=editorial_today[t]
              expected=tokens(card["hook"]+" "+card["action"])
              actual=tokens(value)
              overlap=len(expected&actual)
              wc=word_count(value)
              low,high=(30,55) if t in short_times else (55,85)
              duplicate=any(len(actual&prev)>=7 and len(actual&prev)/max(1,len(actual|prev))>=0.43 for prev in old_tokens)
              problems=[]
              if overlap<2:problems.append("off_topic")
              if household.search(value):problems.append("household_chore")
              if safety.search(value):problems.append("unsafe_scenario")
              if any(ch.isalpha() and "LATIN" not in unicodedata.name(ch,"") for ch in value):
                  problems.append("non_latin")
              if not viewer_cta.search(value):problems.append("no_cta")
              if not low<=wc<=high:problems.append("length")
              if duplicate:problems.append("14d_duplicate")
              if problems:
                  replacement=fallback(t)
                  if not low<=word_count(replacement)<=high or not viewer_cta.search(replacement):
                      raise SystemExit("EDITORIAL_FALLBACK_INVALID "+t)
                  slot["text"]=replacement
                  print("EDITORIAL_QC_REPLACED",target,t,",".join(problems),
                        "original_words",wc,"fallback_words",word_count(replacement),
                        "topic",card["topic"])
              else:
                  print("EDITORIAL_QC_PASS",target,t,"words",wc,"topic",card["topic"])
          import re
          weekday_re=re.compile(r"(?:montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)",re.IGNORECASE)
          date_re=re.compile(r"\b\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?\b|\b\d{4}-\d{2}-\d{2}\b|\b\d{1,2}\.\s*(?:januar|februar|maerz|märz|april|mai|juni|juli|august|september|oktober|november|dezember)\b",re.IGNORECASE)
          import unicodedata
          # Non-blocking CTA audit: record gaps without risking the nightly batch.
          cta_re=re.compile(r"(?i)\b(?:kommentier\w*|schreib\w*|speicher\w*|teil\w*|folg\w*|abonniere\w*)\b")
          for slot in slots:
              text=slot.get("text","").strip()
              word_count=len(text.split())
              low,high=(30,55) if slot.get("time") in short_times else (55,85)
              ab_low,ab_high=(35,45) if slot.get("time") in short_times else (65,75)
              if not low<=word_count<=high:
                  # Preserve the regular four-slot delivery when Gemini slightly overshoots a target.
                  # The outlier is explicitly excluded from the controlled A/B comparison.
                  safety_low,safety_high=(25,75) if slot.get("time") in short_times else (45,120)
                  if not safety_low<=word_count<=safety_high:
                      raise SystemExit("TEXT_WORD_COUNT_UNSAFE "+slot.get("time","")+" "+str(word_count)+" accepted "+str(safety_low)+"-"+str(safety_high))
              if ab_low<=word_count<=ab_high:
                  print("LENGTH_AB_QC",target,slot.get("time"),"SHORT" if slot.get("time") in short_times else "LONG",word_count)
              else:
                  print("LENGTH_AB_OUTLIER_EXCLUDE",target,slot.get("time"),word_count,"target",str(ab_low)+"-"+str(ab_high))
              if weekday_re.search(text) or date_re.search(text):raise SystemExit("CALENDAR_REFERENCE "+slot.get("time",""))
              if any(ch.isalpha() and "LATIN" not in unicodedata.name(ch,"") for ch in text):
                  raise SystemExit("NON_LATIN_LETTERS "+slot.get("time",""))
              if not cta_re.search(text) and "?" not in text:
                  print("CTA_QC_WARNING",slot.get("time",""),"no clear viewer CTA")
          batch={"date":target,"slots":[{"slot":t.replace(":",""),"time":t,"timezone":"Europe/Berlin","audio_url":"","broll_url":"","text":s["text"]} for t,s in zip(times,slots)]}
          issue=gh("POST","/issues",{"title":title,"body":json.dumps(batch,ensure_ascii=False)})
          number=issue["number"]
          print("CREATED_DAY",target,"ISSUE",number)
          # Events emitted using GITHUB_TOKEN do not trigger other GitHub Actions.
          # Explicitly dispatch the day workflow once for the newly created issue.
          gh("POST","/actions/workflows/motus-day.yml/dispatches",{"ref":"main","inputs":{"issue_number":str(number)}})
          print("DAY_WORKFLOW_DISPATCHED",number)
          PY
