name: MOTUS Night Production
on:
  schedule:
    - cron: '37 20 * * *'
    - cron: '37 21 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: motus-night-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Generate next MOTUS day and dispatch exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_KEY: ${{ secrets.JORI_GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 -u - <<'PY'
          import json,os,urllib.request,urllib.error
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Berlin"))
          if os.environ["EVENT"]=="schedule" and not ((now.hour==22 and now.minute>=37) or now.hour==23 or 0<=now.hour<7):
              print("OUTSIDE_NIGHT_WINDOW",now.isoformat());raise SystemExit(0)
          target=(now.date()+timedelta(days=2 if now.hour>=22 else 1)).isoformat()
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","User-Agent":"motus-night-producer"}
          def gh(method,path,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode()
              url=("https://api.github.com"+path if path.startswith("/search/") else "https://api.github.com/repos/"+repo+path)
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=50) as response:
                  raw=response.read();return json.loads(raw) if raw else {}
          title="[MOTUS-DAY] "+target
          # Query the exact issue title server-side; avoid the 500-item listing limit.
          from urllib.parse import quote
          issues=[]
          query=quote(f'repo:{repo} is:issue in:title "{target}"',safe="")
          found=gh("GET",f"/search/issues?q={query}&per_page=100").get("items",[])
          issues=[i for i in found if not i.get("pull_request") and i.get("title")==title]
          existing=next(iter(issues),None)
          if existing:
              print("ALREADY_EXISTS",existing["number"],existing["state"])
              if existing["state"]=="open":
                  notes=gh("GET",f"/issues/{existing['number']}/comments?per_page=100")
                  complete=any(str(c.get("body","")).startswith("MOTUS_DAY_COMPLETE") for c in notes)
                  print("DAY_COMPLETION_VERIFIED",complete,"ISSUE",existing["number"])
                  if not complete:
                      # Recover a lost initial handoff: status workflow repairs missing renderer slots,
                      # while the day workflow validates and dispatches the batch idempotently.
                      runs=[]
                      for page in range(1,6):
                          chunk=gh("GET",f"/actions/workflows/motus-day.yml/runs?per_page=100&page={page}").get("workflow_runs",[])
                          runs.extend(chunk)
                          if len(chunk)<100:break
                      title_match=f"Daily Motus {existing['number']}"
                      matched=sorted((run for run in runs if str(run.get("display_title",""))==title_match),key=lambda run:run.get("created_at",""),reverse=True)
                      if not matched or (matched[0].get("status")=="completed" and matched[0].get("conclusion")!="success"):
                          gh("POST","/actions/workflows/motus-day.yml/dispatches",{"ref":"main","inputs":{"issue_number":str(existing["number"])}})
                          print("RECOVERED_MISSING_OR_FAILED_DAY_HANDOFF",existing["number"])
                      else:
                          print("RECONCILIATION_ACTIVE_EVERY_15_MINUTES_IN_MOTUS_DAY_STATUS")
              raise SystemExit(0)
          key=os.environ.get("GEMINI_KEY","")
          if not key:raise SystemExit("GEMINI_KEY_MISSING")
          # Quality experiment for future (not yet generated) days only.
          # Keep word count, slots, music and renderer unchanged to isolate the effect.
          prompt=("Erstelle vier originelle, voneinander klar verschiedene deutsche MOTUS-Kurztexte "
                  "fuer einen Tagesplan mit den Slots 07:00,12:00,18:30,22:00. Jeweils 65 bis 75 Woerter, "
                  "strikt niemals mehr als 85 Woerter pro Text. "
                  "Beginne JEDEN Text sofort mit einem anderen konkreten Hook: einer beobachtbaren "
                  "Alltagssituation, einer spannenden Frage oder einem nachvollziehbaren Konflikt. "
                  "Die ersten zwei Sekunden duerfen keine allgemeinen Floskeln ueber Energie, "
                  "Fokus, Motivation oder den Tagesbeginn enthalten. "
                  "Baue in jeden Text eine anschauliche, realistische Alltagsszene ein. "
                  "Vermeide austauschbare Phrasen, Kunstwoerter und unnatuerliche Formulierungen. "
                  "Pruefe vor der JSON-Ausgabe jeden Text auf korrekte deutsche Rechtschreibung und Grammatik. "
                  "Verwende ä, ö, ü und ß nach deutschen Rechtschreibregeln; "
                  "schreibe ss, wo es korrekt ist, und vermeide ae/oe/ue-Umschriften; "
                  "keine Tippfehler, Fantasiewoerter oder falschen Wortzusammensetzungen. "
                  "Morgens geht es um eine konkrete Gewohnheit oder Entscheidung, mittags um ein "
                  "praktisches Hindernis, abends um eine soziale Situation oder Grenze, nachts um "
                  "den Umgang mit Grübeln oder Erholung. Die vier Themen muessen sich unterscheiden. "
                  "JEDER der vier Texte braucht eine eindeutige, natuerlich eingebettete "
                  "Handlungsaufforderung an Zuschauer: Kommentarfrage, Speichern, Teilen oder Folgen. "
                  "Variiere die CTA-Art ueber alle vier Slots; keine blossen Selbstanweisungen. "
                  "Keine mechanisch angehaengte Standard-CTA und keine privaten Daten erfragen. "
                  "Direkte Du-Ansprache, idiomatisches korrektes Deutsch ausschliesslich in "
                  "lateinischer Schrift, keine fremdsprachigen Einschuebe, kein Clickbait. "
                  "Erwaehne keine Wochentage, Datumsangaben, Uhrzeiten, konkretes Wetter oder "
                  "kalendarische Behauptungen. Antworte ausschliesslich als JSON mit Schluessel "
                  "slots, Array von vier Objekten mit time und text.")
          payload={"contents":[{"parts":[{"text":prompt}]}],"generationConfig":{"responseMimeType":"application/json","temperature":0.9}}
          import time
          models=["gemini-3.5-flash-lite","gemini-3.8-flash"]
          generated=None
          last_error="no model attempted"
          for model in models:
              for attempt in range(3):
                  req=urllib.request.Request(
                      f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type":"application/json","x-goog-api-key":key},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=65) as response:
                          generated=json.load(response)
                      print("GEMINI_GENERATED",model)
                      break
                  except urllib.error.HTTPError as exc:
                      body=exc.read().decode("utf-8","replace")
                      try:
                          detail=json.loads(body).get("error",{}).get("message","")
                      except (json.JSONDecodeError,AttributeError,TypeError):
                          detail=body[:500]
                      last_error=f"{model} HTTP {exc.code}"
                      print("GEMINI_HTTP_ERROR",model,exc.code,str(detail)[:400])
                      if exc.code in (408,429,500,502,503,504) and attempt<2:
                          delay=15*(attempt+1)
                          print("GEMINI_RETRY",attempt+1,"HTTP",exc.code,"WAIT_SECONDS",delay)
                          time.sleep(delay)
                          continue
                      break
                  except (urllib.error.URLError,TimeoutError) as exc:
                      last_error=f"{model} {type(exc).__name__}"
                      if attempt<2:
                          delay=15*(attempt+1)
                          print("GEMINI_RETRY",attempt+1,type(exc).__name__,"WAIT_SECONDS",delay)
                          time.sleep(delay)
                          continue
                      print("GEMINI_MODEL_EXHAUSTED",model,last_error)
                      break
              if generated is not None:
                  break
              print("GEMINI_FALLBACK_MODEL",model)
          if generated is None:
              raise SystemExit("GEMINI_ALL_MODELS_FAILED "+last_error)
          raw=generated["candidates"][0]["content"]["parts"][0]["text"]
          slots=json.loads(raw)["slots"]
          # Deterministic corrections for verified recurrent Gemini misspellings.
          # Apply only while creating a new day; existing issues/videos stay untouched.
          spelling_fixes={"Stioerfaktor":"Störfaktor","nervogen":"nervös"}
          for slot in slots:
              original=slot.get("text","")
              corrected=original
              for wrong,right in spelling_fixes.items():
                  corrected=corrected.replace(wrong,right)
              if corrected!=original:
                  print("SPELLING_QC_CORRECTED",slot.get("time",""))
                  slot["text"]=corrected
          if len(slots)!=4:raise SystemExit("BAD_SLOT_COUNT")
          times=["07:00","12:00","18:30","22:00"]
          if [s.get("time") for s in slots]!=times:raise SystemExit("BAD_SLOT_TIMES")
          import re
          weekday_re=re.compile(r"(?:montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)",re.IGNORECASE)
          date_re=re.compile(r"\b\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?\b|\b\d{4}-\d{2}-\d{2}\b|\b\d{1,2}\.\s*(?:januar|februar|maerz|märz|april|mai|juni|juli|august|september|oktober|november|dezember)\b",re.IGNORECASE)
          import unicodedata
          # Non-blocking CTA audit: record gaps without risking the nightly batch.
          cta_re=re.compile(r"(?i)\b(?:kommentier\w*|schreib\w*|speicher\w*|teil\w*|folg\w*|abonniere\w*)\b")
          for slot in slots:
              text=slot.get("text","").strip()
              word_count=len(text.split())
              if not 60<=word_count<=85:raise SystemExit("TEXT_WORD_COUNT "+str(word_count))
              if weekday_re.search(text) or date_re.search(text):raise SystemExit("CALENDAR_REFERENCE "+slot.get("time",""))
              if any(ch.isalpha() and "LATIN" not in unicodedata.name(ch,"") for ch in text):
                  raise SystemExit("NON_LATIN_LETTERS "+slot.get("time",""))
              if not cta_re.search(text) and "?" not in text:
                  print("CTA_QC_WARNING",slot.get("time",""),"no clear viewer CTA")
          batch={"date":target,"slots":[{"slot":t.replace(":",""),"time":t,"timezone":"Europe/Berlin","audio_url":"","broll_url":"","text":s["text"]} for t,s in zip(times,slots)]}
          issue=gh("POST","/issues",{"title":title,"body":json.dumps(batch,ensure_ascii=False)})
          number=issue["number"]
          print("CREATED_DAY",target,"ISSUE",number)
          # Events emitted using GITHUB_TOKEN do not trigger other GitHub Actions.
          # Explicitly dispatch the day workflow once for the newly created issue.
          gh("POST","/actions/workflows/motus-day.yml/dispatches",{"ref":"main","inputs":{"issue_number":str(number)}})
          print("DAY_WORKFLOW_DISPATCHED",number)
          PY
